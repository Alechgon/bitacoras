<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOSER San Pablo · Mantención</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="datos.js"></script>
<style>
:root{
  /* papel y tinta */
  --papel:#f5f6f6; --panel:#ffffff; --panel2:#fafbfa;
  --ink:#10211a; --muted:#5a6b64; --line:#dde4e0; --line2:#eef2f0;
  /* marca */
  --green:#14532d; --green2:#1e6b3a; --greenSoft:#e4efe8;
  /* semánticos */
  --red:#b3261e; --redSoft:#fbe4e1;
  --amber:#8a6100; --amberSoft:#fff3d6;
  --blue:#1f5fb4; --blueSoft:#e4edfa;
  --violet:#5b4a9c; --violetSoft:#ece8f7;
  --ok:#2e7d32;
  --r:5px; --sh:0 1px 2px rgba(16,33,26,.05);
  --sans:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papel:#0e1511; --panel:#161d19; --panel2:#1b2420;
  --ink:#e7ede9; --muted:#8ea096; --line:#28332d; --line2:#1f2a24;
  --green:#1e6b3a; --green2:#3d9a5c; --greenSoft:#1b3022;
  --redSoft:#3a1f1c; --amberSoft:#33290f; --blueSoft:#172a42; --violetSoft:#241e3a;
  --red:#e89a93; --amber:#e4bd6a; --blue:#86b2ea; --ok:#8fd3a3;
  --sh:0 1px 2px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --papel:#0e1511; --panel:#161d19; --panel2:#1b2420;
  --ink:#e7ede9; --muted:#8ea096; --line:#28332d; --line2:#1f2a24;
  --green:#1e6b3a; --green2:#3d9a5c; --greenSoft:#1b3022;
  --redSoft:#3a1f1c; --amberSoft:#33290f; --blueSoft:#172a42; --violetSoft:#241e3a;
  --red:#e89a93; --amber:#e4bd6a; --blue:#86b2ea; --ok:#8fd3a3;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--ink);font:15px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* ---------- cabecera y navegación ---------- */
header{position:sticky;top:0;z-index:40;background:var(--green);color:#fff;
  padding:11px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:14.5px;margin:0;font-weight:600;letter-spacing:-.01em}
header .marca{font-size:11.5px;opacity:.72;font-family:var(--mono)}
header .sub{font-size:11.5px;opacity:.72;margin-left:auto;font-family:var(--mono)}
nav{position:sticky;top:43px;z-index:39;background:var(--panel);
  border-bottom:1px solid var(--line);display:flex;gap:0;overflow-x:auto;
  padding:0 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
  padding:12px 13px;font:600 13px/1 var(--sans);cursor:pointer;white-space:nowrap;
  letter-spacing:-.005em}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--green2);border-bottom-color:var(--green2)}
main{padding:18px;max-width:1500px;margin:0 auto}
.view{display:none}.view.on{display:block}

/* ---------- bloques ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 3px;font-weight:600;letter-spacing:-.01em}
h3{font-size:13.5px;margin:0 0 8px;font-weight:600}
.rot{font-size:11.5px;font-weight:600;color:var(--muted);margin:0 0 10px;
  padding-bottom:7px;border-bottom:1px solid var(--line)}
.dim{color:var(--muted);font-size:12.5px}
.mini{font-size:11.5px;color:var(--muted)}
.num{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}

/* ---------- metas de contrato ---------- */
.meta{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:0 18px 16px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.meta .tope{position:absolute;inset:0 0 auto 0;height:3px}
.meta h3{margin:18px 0 2px;font-size:15px}
.meta .cifra{display:flex;align-items:baseline;gap:9px;margin:14px 0 9px}
.meta .cifra b{font-family:var(--mono);font-size:40px;font-weight:600;line-height:1;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.meta .cifra span{font-size:13px;color:var(--muted)}
.riel{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.riel i{display:block;height:100%;transition:width .4s ease}
@media(prefers-reduced-motion:reduce){.riel i{transition:none}}
.meta dl{display:flex;gap:24px;margin:14px 0 0;flex-wrap:wrap}
.meta dt{font-size:11.5px;color:var(--muted);margin:0}
.meta dd{margin:2px 0 0;font-family:var(--mono);font-size:15px;font-weight:600}
dd.ok{color:var(--ok)} dd.alerta{color:var(--red)}

/* ---------- tira de indicadores ---------- */
.tira{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:1px;
  background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tira .k{background:var(--panel);padding:13px 15px}
.tira .k b{display:block;font-family:var(--mono);font-size:23px;font-weight:600;
  line-height:1.25;font-variant-numeric:tabular-nums}
.tira .k span{font-size:11.5px;color:var(--muted);display:block;margin-top:1px}
.tira .k.alerta b{color:var(--red)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.kpi .k{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .k b{display:block;font-family:var(--mono);font-size:23px;line-height:1.2;font-weight:600}
.kpi .k span{font-size:11.5px;color:var(--muted)}

/* ---------- controles ---------- */
button.btn,.btn{background:var(--green2);color:#fff;border:0;border-radius:4px;
  padding:9px 15px;font:600 13px/1.2 var(--sans);cursor:pointer;min-height:36px}
.btn.ghost{background:transparent;color:var(--green2);box-shadow:inset 0 0 0 1.5px var(--green2)}
.btn.red{background:var(--red)} .btn.gray{background:var(--muted)}
.btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:4px;padding:9px 11px;font:14px/1.4 var(--sans);width:100%;min-height:38px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green2);outline-offset:-1px;
  border-color:var(--green2)}
label.f{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:0 0 4px}
:focus-visible{outline:2px solid var(--green2);outline-offset:2px;border-radius:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- etiquetas ---------- */
.pill{display:inline-block;padding:1.5px 8px;border-radius:3px;font-size:11px;font-weight:600;
  letter-spacing:-.005em}
.p-red{background:var(--redSoft);color:var(--red)}
.p-amb{background:var(--amberSoft);color:var(--amber)}
.p-grn{background:var(--greenSoft);color:var(--ok)}
.p-blu{background:var(--blueSoft);color:var(--blue)}
.p-vio{background:var(--violetSoft);color:var(--violet)}
.score{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:23px;
  border-radius:3px;font-family:var(--mono);font-weight:600;font-size:12px;
  font-variant-numeric:tabular-nums}
.s-hi{background:var(--redSoft);color:var(--red)}
.s-md{background:var(--amberSoft);color:var(--amber)}
.s-lo{background:var(--greenSoft);color:var(--ok)}

/* ---------- tablas ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;font-weight:600;color:var(--muted);
  border-bottom:1px solid var(--line);padding:9px 9px;position:sticky;top:0;
  background:var(--panel);white-space:nowrap;z-index:1}
td{border-bottom:1px solid var(--line2);padding:8px 9px;vertical-align:top}
tbody tr:hover td{background:var(--panel2)}
.scroll{overflow:auto;max-height:70vh;border-radius:4px;border:1px solid var(--line)}

/* ---------- tablero del día ---------- */
.board{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.board{grid-template-columns:1fr}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.colhead{display:flex;align-items:baseline;gap:9px;padding-bottom:9px;margin-bottom:11px;
  border-bottom:1px solid var(--line)}
.colhead b{font-size:14px;font-weight:600}
.slot{border:1px dashed var(--line);border-radius:4px;padding:9px;margin-bottom:9px;min-height:60px}
.slot.over{border-color:var(--green2);border-style:solid;background:var(--greenSoft)}
.slot .sh{font-size:10.5px;font-weight:600;color:var(--muted);margin-bottom:7px;
  display:flex;justify-content:space-between;gap:8px;font-family:var(--mono)}
.task{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--blue);
  border-radius:3px;padding:10px 11px;margin-bottom:7px;cursor:grab;box-shadow:var(--sh)}
.task.k-cor{border-left-color:var(--red)}
.task.k-mix{border-left-color:var(--amber)}
.task.k-extra{border-left-color:var(--violet)}
.task.k-hist{border-left-color:var(--muted);opacity:.78}
.task.done{opacity:.55}.task.done .tt{text-decoration:line-through}
.task .tt{font-weight:600;font-size:13.5px;letter-spacing:-.005em}
.task .tt .rbd{font-family:var(--mono)}
.task .td{font-size:11.5px;color:var(--muted);margin-top:3px}
.task .tm{display:flex;gap:6px;align-items:center;margin-top:8px;flex-wrap:wrap}
.chk{width:17px;height:17px;accent-color:var(--green2);flex:0 0 auto}
.tbtn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:3px;
  padding:3px 8px;font:600 11px/1.3 var(--sans);cursor:pointer;min-height:27px}
.tbtn:hover{border-color:var(--green2);color:var(--green2)}
.tbtn.x{color:var(--red)}
.tbtn.x:hover{border-color:var(--red);background:var(--redSoft)}
.seg{display:flex;align-items:center;margin-top:8px;flex-wrap:wrap}
.seg .sg{border:1px solid var(--line);background:var(--panel);color:var(--muted);
  padding:4px 12px;font:600 11.5px/1.3 var(--sans);cursor:pointer;min-height:29px}
.seg .sg:first-of-type{border-radius:3px 0 0 3px}
.seg .sg:nth-of-type(2){border-radius:0 3px 3px 0;border-left:0}
.seg .sg:hover{color:var(--ink)}
.seg .sg.on.prev{background:var(--green2);color:#fff;border-color:var(--green2)}
.seg .sg.on.corr{background:var(--amber);color:#fff;border-color:var(--amber)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(8,16,12,.55);display:none;z-index:99;
  align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border-radius:6px;max-width:760px;width:100%;
  max-height:88vh;overflow:auto;padding:20px;box-shadow:0 16px 48px rgba(8,16,12,.3)}

/* ---------- gantt ---------- */
.gantt{overflow:auto;border:1px solid var(--line);border-radius:4px}
.gantt table{font-size:11px}
.gantt td,.gantt th{padding:3px 6px;white-space:nowrap}
.gantt .cell{width:20px;height:19px;line-height:19px;text-align:center;font-weight:600;
  color:#fff;border-radius:2px;font-size:10.5px;padding:0;font-family:var(--mono)}
.gantt .stk{position:sticky;left:0;background:var(--panel);z-index:3;
  box-shadow:1px 0 0 var(--line)}
.gantt th.stk{z-index:4}
.gantt .nm{max-width:210px;overflow:hidden;text-overflow:ellipsis}
.gantt tbody tr:hover td{background:var(--panel2)}
.gantt tbody tr:hover .stk{background:var(--panel2)}

/* ---------- otros ---------- */
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;background:var(--green2)}
.bar i.late{background:var(--red)}
.searchbig{max-width:720px;margin:28px auto}
.searchbig input{font-size:18px;padding:15px 18px;border-radius:5px;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 13px;
  font:600 12px/1.3 var(--sans);cursor:pointer;color:var(--muted);min-height:30px}
.chip:hover{border-color:var(--green2);color:var(--green2)}
.chip.on{background:var(--green2);color:#fff;border-color:var(--green2)}
.res{border-left:2px solid var(--green2);padding-left:11px;margin:12px 0}
details{border:1px solid var(--line);border-radius:4px;margin-bottom:8px;overflow:hidden}
details summary{padding:10px 12px;font-weight:600;cursor:pointer;background:var(--panel2);
  font-size:13px}
details summary:hover{background:var(--greenSoft)}
details .in{padding:11px 12px}
.aviso{position:fixed;right:16px;bottom:16px;z-index:120;background:var(--green);color:#fff;
  padding:14px 16px;border-radius:5px;box-shadow:0 10px 32px rgba(8,16,12,.35);max-width:330px;
  display:none;font-size:13.5px}
.aviso.on{display:block}
.drop{border:1.5px dashed var(--line);border-radius:5px;padding:30px;text-align:center;
  color:var(--muted)}
.drop.over{border-color:var(--green2);background:var(--greenSoft);color:var(--green2)}
.wa{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:5px;
  padding:14px;white-space:pre-wrap;font:13px/1.55 var(--sans)}
mark{background:var(--amberSoft);color:var(--ink);padding:0 2px;border-radius:2px}
.spark{display:block;margin-top:6px}

@media(max-width:620px){
  main{padding:11px}.card{padding:13px}
  header h1{font-size:13px}header .sub{display:none}
  nav button{padding:11px 11px;font-size:12.5px}
  .task .tt{font-size:13px}
  .meta .cifra b{font-size:34px}
  table{font-size:12px}th,td{padding:7px 6px}
  .gantt .nm{max-width:110px}.gantt td,.gantt th{padding:2px 3px}
  .gantt .cell{width:17px;height:17px;line-height:17px;font-size:9.5px}
}
@media print{nav,header,.noprint{display:none!important}.card{box-shadow:none;border:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<header>
  <h1>SOSER · Sucursal San Pablo</h1>
  <span class="marca">Mantención PAE · 85-34-LR25</span>
  <span class="sub" id="hdrmeta"></span>
  <button class="btn ghost" style="color:#fff;border-color:rgba(255,255,255,.5);padding:5px 10px" onclick="toggleTema()">◐</button>
</header>
<nav id="nav"></nav>
<main>
  <section class="view" id="v-panel"></section>
  <section class="view" id="v-hoy"></section>
  <section class="view" id="v-semana"></section>
  <section class="view" id="v-crono"></section>
  <section class="view" id="v-estab"></section>
  <section class="view" id="v-bits"></section>
  <section class="view" id="v-buscar"></section>
  <section class="view" id="v-pend"></section>
  <section class="view" id="v-datacora"></section>
  <section class="view" id="v-supers"></section>
  <section class="view" id="v-wsp"></section>
  <section class="view" id="v-config"></section>
</main>
<div class="modal" id="modal"><div class="box" id="modalbox"></div></div>
<div class="aviso" id="aviso"></div>

<script>
/* ============================ ESTADO ============================ */
const D = window.SOSER;
const E = {}; D.ESTAB.forEach(e => E[e.rbd] = e);
const LS = 'soser-sanpablo-v1';
let ST = {plan:[], extras:[], bits:[], hechos:{}, log:[], cfg:{}};

/* --- caché persistente: IndexedDB con respaldo en localStorage --- */
let IDB=null;
function abrirIDB(){ return new Promise(res=>{
  if(!window.indexedDB) return res(null);
  const r=indexedDB.open('soser-sanpablo',1);
  r.onupgradeneeded=()=>{ const db=r.result;
    if(!db.objectStoreNames.contains('estado')) db.createObjectStore('estado'); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }); }
function idbGet(k){ return new Promise(res=>{ if(!IDB) return res(null);
  try{ const t=IDB.transaction('estado','readonly').objectStore('estado').get(k);
    t.onsuccess=()=>res(t.result); t.onerror=()=>res(null); }catch(e){ res(null); } }); }
function idbSet(k,v){ return new Promise(res=>{ if(!IDB) return res(false);
  try{ const t=IDB.transaction('estado','readwrite').objectStore('estado').put(v,k);
    t.onsuccess=()=>res(true); t.onerror=()=>res(false); }catch(e){ res(false); } }); }
async function persistirDuro(){
  if(navigator.storage && navigator.storage.persist){
    try{ const ok=await navigator.storage.persisted() || await navigator.storage.persist();
      return ok; }catch(e){} }
  return false;
}
let MIGRADO = 0;
function fusionar(guardado){
  /* Parte del plan nuevo de datos.js y le vuelve a aplicar lo que el usuario editó,
     emparejando por id. Así entran las visitas nuevas sin perder cambios. */
  const base = JSON.parse(JSON.stringify(D.PLAN));
  const prev = {}; (guardado||[]).forEach(p=>prev[p.id]=p);
  let tocados = 0;
  base.forEach(p=>{
    const v = prev[p.id]; if(!v) return;
    const cambiado = v.estado!=='programada' || v.fecha!==p.fecha || v.tec!==p.tec
      || v.bloque!==p.bloque || (v.aplaz||0)>0 || v.folio;
    if(cambiado){ tocados++;
      p.estado=v.estado; p.fecha=v.fecha; p.tec=v.tec; p.bloque=v.bloque;
      p.aplaz=v.aplaz||0; p.pts=v.pts||p.pts; if(v.folio) p.folio=v.folio;
      if(v.absorbidaPor) p.absorbidaPor=v.absorbidaPor;
      if(v.detalle && v.detalle!==p.detalle) p.detalle=v.detalle; }
  });
  MIGRADO = base.length - (guardado||[]).length;
  return base;
}
function cargar(){
  const raw = localStorage.getItem(LS);
  ST = {plan:JSON.parse(JSON.stringify(D.PLAN)), extras:[], bits:[], hechos:{}, log:[], cfg:{},
        version:D.META.version};
  if(raw){ try{ const s = JSON.parse(raw);
    ST.extras = s.extras||[]; ST.bits = s.bits||[]; ST.hechos = s.hechos||{};
    ST.log = s.log||[]; ST.cfg = s.cfg||{}; ST.ts = s.ts;
    if(s.version === D.META.version && s.plan){ ST.plan = s.plan; }
    else { ST.plan = fusionar(s.plan); ST.version = D.META.version; }
  }catch(e){ console.warn('estado corrupto', e); } }
}
let guardarTO=null;
function guardar(){
  ST.ts = new Date().toISOString(); ST.version = D.META.version;
  try{ localStorage.setItem(LS, JSON.stringify(ST)); }
  catch(e){ console.warn('localStorage lleno', e); }
  clearTimeout(guardarTO);
  guardarTO = setTimeout(()=>{ idbSet('v1', JSON.parse(JSON.stringify(ST))); }, 400);
}
cargar();
(async()=>{
  IDB = await abrirIDB();
  const g = await idbGet('v1');
  if(g && (!ST.ts || (g.ts||'') > ST.ts)){
    const planG = (g.version === D.META.version) ? g.plan : fusionar(g.plan);
    ST = Object.assign(ST, g, {plan:planG, version:D.META.version});
    try{ localStorage.setItem(LS, JSON.stringify(ST)); }catch(e){}
    if(typeof ir==='function') refrescar();
  }
  await persistirDuro();
})();

/* ============================ UTIL ============================ */
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function d2(n){return String(n).padStart(2,'0')}
function hoyISO(){ return D.META.hoy }
function fISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmt(s){ if(!s) return '—'; const d=fISO(s); return d2(d.getDate())+'-'+MES[d.getMonth()]+'-'+d.getFullYear(); }
function fcorto(s){ const d=fISO(s); return d2(d.getDate())+'-'+MES[d.getMonth()]; }
function diaSem(s){ return DIA[fISO(s).getDay()] }
function esViernes(s){ return fISO(s).getDay()===5 }
function esHabil(s){ const d=fISO(s).getDay(); return d>=1&&d<=5 && !D.META.feriados.includes(s); }
function addDias(s,n){ const d=fISO(s); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+d2(d.getMonth()+1)+'-'+d2(d.getDate()); }
function sigHabil(s){ let x=addDias(s,1); let g=0; while(!esHabil(x)&&g++<40) x=addDias(x,1); return x; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sc(p){ return p>=13?'s-hi':p>=9?'s-md':'s-lo'; }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function horaBloque(fecha,b){ return esViernes(fecha) ? (D.META.bloquesV[b]||'—') : (D.META.bloquesLJ[b]||'—'); }
function claseCard(c){
  if(c==='HISTORICO') return 'k-hist';
  if(c==='CORRECTIVO URGENTE') return 'k-cor';
  if(c.includes('CORRECTIVO')) return 'k-mix';
  if(c==='EXTRA') return 'k-extra';
  return ''; }
function pillCard(c){
  if(c==='HISTORICO') return 'p-grn';
  if(c==='CORRECTIVO URGENTE') return 'p-red';
  if(c.includes('CORRECTIVO')) return 'p-amb';
  if(c==='EXTRA') return 'p-vio';
  return 'p-blu'; }

function tareasDe(fecha){
  return vivas().filter(p=>p.fecha===fecha);
}
/* todas() incluye las anuladas (para buscarlas por id); vivas() es lo que se muestra */
function todas(){ return ST.plan.concat(ST.extras); }
function vivas(){ return todas().filter(p=>p.estado!=='anulada'); }

/* Solo al cambiar de pestaña se sube al inicio. Cualquier botón dentro de la vista
   vuelve a dibujarla con refrescar(), que deja la pantalla donde estaba. */
function ir(k){ const cambia = k!==actual; actual=k;
  VISTAS.forEach(([v])=>{ document.getElementById('v-'+v).classList.toggle('on',v===k);
    document.getElementById('nb-'+v).classList.toggle('on',v===k); });
  if(cambia){ RENDER[k](); window.scrollTo(0,0); } else refrescar();
}
function refrescar(fn){
  const y = window.scrollY, x = window.scrollX;
  const sec = document.getElementById('v-'+actual);
  const inner = sec ? [...sec.querySelectorAll('.scroll,.board,.gantt')].map(el=>[el.scrollTop,el.scrollLeft]) : [];
  /* fija la altura mientras se redibuja, así el navegador no salta arriba */
  if(sec) sec.style.minHeight = sec.offsetHeight+'px';
  (fn || RENDER[actual])();
  if(sec){ [...sec.querySelectorAll('.scroll,.board,.gantt')].forEach((el,i)=>{
      if(inner[i]){ el.scrollTop=inner[i][0]; el.scrollLeft=inner[i][1]; } }); }
  window.scrollTo(x,y);
  requestAnimationFrame(()=>{ window.scrollTo(x,y); if(sec) sec.style.minHeight=''; });
}

/* ====================== AVANCE DE LAS METAS ====================== */
const ES_PREV = t => /plan preventivo|preventiv/i.test(t||'');
function avance(){
  const junaeb = D.ESTAB.filter(e=>e.inst==='Junaeb');
  const jard   = D.ESTAB.filter(e=>e.inst!=='Junaeb');
  /* Meta 1 — JUNAEB: cuenta cualquier visita cargada en Datácora (emergencia, preventiva,
     mutualidad, acta). El export del 30-09 ya trae 31; lo que marques acá se suma. */
  const okJ = new Set((D.DC||[]).filter(d=>d.cuenta).map(d=>d.rbd));
  todas().filter(p=>p.estado==='realizada' && p.fecha >= D.META.datacoraCorte).forEach(p=>okJ.add(p.rbd));
  /* Meta 2 — jardines: preventiva del 2° semestre, y si el jardín tiene sala cuna
     tienen que estar las dos partes (JI y SC). Viene clasificado del registro. */
  const partes = {};
  todas().filter(p=>p.estado==='realizada' && p.fecha >= D.META.corteS2 && ES_PREV(p.tipoReal))
    .forEach(p=>{ (partes[p.rbd]=partes[p.rbd]||new Set()).add(p.parte||'JI'); });
  /* en jardines una correctiva NO suma: solo entra la preventiva */
  (D.DC||[]).filter(d=>d.tipo==='Preventiva').forEach(d=>{
    (partes[d.rbd]=partes[d.rbd]||new Set()).add('JI'); });
  const okG = new Set(jard.filter(e=>{
    const h = partes[e.rbd]; if(!h || !h.size) return false;
    return e.nbit===2 ? (h.has('JI') && h.has('SC')) : true;
  }).map(e=>e.rbd));
  const medias = jard.filter(e=>!okG.has(e.rbd) && partes[e.rbd] && partes[e.rbd].size);
  return {junaeb:junaeb.length, hechoJ:junaeb.filter(e=>okJ.has(e.rbd)).length,
          jard:jard.length, hechoG:okG.size, medias:medias.length,
          faltanJ:junaeb.filter(e=>!okJ.has(e.rbd)), faltanG:jard.filter(e=>!okG.has(e.rbd)),
          partes};
}
/* ---------- indicadores de contrato ---------- */
function habilesEntre(a,b){
  if(!a||!b||a>b) return 0;
  let n=0,d=a; let g=0;
  while(d<=b && g++<400){ if(esHabil(d)) n++; d=addDias(d,1); }
  return n;
}
function kpis(){
  const a=avance(), hoy=hoyISO();
  const hab1=habilesEntre(hoy,D.META.metaJunaeb), hab2=habilesEntre(hoy,D.META.metaJardines);
  const f1=a.junaeb-a.hechoJ, f2=a.jard-a.hechoG;
  const req1=hab1?f1/hab1:f1, req2=hab2?f2/hab2:f2;
  // ritmo real: realizadas en los últimos 14 días corridos
  const desde=addDias(hoy,-14);
  const hechas=todas().filter(p=>p.estado==='realizada'&&p.origen!=='historico'
    &&p.fecha>=desde&&p.fecha<=hoy).length;
  const habR=Math.max(1,habilesEntre(desde,hoy));
  const ritmo=hechas/habR;
  // cumplimiento de lo ya vencido
  const venc=todas().filter(p=>p.origen!=='historico'&&p.estado!=='anulada'&&p.fecha<=hoy);
  const cum=venc.length?venc.filter(p=>p.estado==='realizada').length/venc.length:1;
  const dias=D.CORR.map(c=>c.dias||0);
  const prom=dias.length?dias.reduce((x,y)=>x+y,0)/dias.length:0;
  const porCrit={}, porSup={};
  D.CORR.forEach(c=>{ porCrit[c.crit]=(porCrit[c.crit]||0)+1;
    const sp=(E[c.rbd]||{}).sup||'Sin supervisora'; porSup[sp]=(porSup[sp]||0)+1; });
  return {a, hab1, hab2, f1, f2, req1, req2, ritmo, cum,
    prom, sobre10:D.CORR.filter(c=>(c.dias||0)>10).length, porCrit, porSup,
    dobles: todas().filter(p=>(p.aplaz||0)>=2).length,
    realizadas: todas().filter(p=>p.estado==='realizada').length,
    pendientes: todas().filter(p=>p.estado==='programada').length};
}
function fechaProyectada(falta, ritmo){
  if(falta<=0) return 'ya está';
  if(!ritmo) return 'sin ritmo medible';
  let d=hoyISO(), q=0, g=0;
  while(q<falta && g++<400){ d=sigHabil(d); q+=ritmo; }
  return fmt(d);
}
function tarjetaMeta(nom, sub, hecho, total, falta, hab, req, ritmo, color, plazo){
  const p=total?Math.round(100*hecho/total):0;
  const al=ritmo>=req;
  const proy=fechaProyectada(falta, ritmo);
  return `<article class="meta"><div class="tope" style="background:${color}"></div>
    <h3>${nom}</h3><p class="dim" style="margin:0">${sub}</p>
    <div class="cifra"><b>${hecho}</b><span>de ${total} · quedan ${hab} días hábiles hasta el ${fmt(plazo)}</span></div>
    <div class="riel"><i style="width:${p}%;background:${color}"></i></div>
    <dl>
      <div><dt>Faltan</dt><dd>${falta}</dd></div>
      <div><dt>Exige</dt><dd>${req.toFixed(1)}/día</dd></div>
      <div><dt>Vas a</dt><dd class="${al?'ok':'alerta'}">${ritmo.toFixed(1)}/día</dd></div>
      <div><dt>Terminarías</dt><dd class="${al?'ok':'alerta'}" style="font-size:13px">${proy}</dd></div>
    </dl></article>`;
}

let fechaHoy = hoyISO();
function vHoy(){
  const f=fechaHoy, vie=esViernes(f);
  const blos = vie?[1,2]:[1,2,3];
  let h = barrasMeta();
  h += `<div class="card"><div class="row">
    <div><label class="f">Día de trabajo</label>
      <input type="date" id="fhoy" value="${f}" onchange="fechaHoy=this.value;refrescar()" style="width:170px"></div>
    <div><label class="f">&nbsp;</label>
      <div class="row"><button class="btn ghost" onclick="fechaHoy=sigHabilAtras(fechaHoy);refrescar()">◀</button>
      <button class="btn ghost" onclick="fechaHoy=sigHabil(fechaHoy);refrescar()">▶</button>
      <button class="btn ghost" onclick="fechaHoy=hoyISO();refrescar()">Hoy</button></div></div>
    <div style="margin-left:auto;text-align:right">
      <div><b>${diaSem(f)} ${fmt(f)}</b></div>
      <div class="dim">${vie?'Viernes · jornada '+D.META.jornadaV+' · 2 bloques':'Jornada '+D.META.jornadaLJ+' · 3 bloques'}</div>
    </div></div>
    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="modalAgregar()">+ Agregar emergencia</button>
      <button class="btn ghost" onclick="modalCierre()">Cerrar día y postergar</button>
      <button class="btn ghost" onclick="imprimirDia()">Imprimir orden</button>
      ${!esHabil(f)?'<span class="pill p-amb">Día no hábil</span>':''}
    </div></div>`;

  h += '<div class="board">';
  for(const tk of ['RODRIGO','CAMILO']){
    const t=D.META.tecnicos[tk];
    h += `<div class="col"><div class="colhead">
      <b>${t.nombre}</b><span class="dim">${t.cred}</span></div>`;
    for(const b of blos){
      const tareas = tareasDe(f).filter(p=>p.tec===tk && p.bloque===b);
      h += `<div class="slot" data-tec="${tk}" data-b="${b}" ondragover="dOver(event)"
        ondragleave="this.classList.remove('over')" ondrop="dDrop(event,'${tk}',${b},'${f}')">
        <div class="sh"><span>Bloque ${b} · ${horaBloque(f,b)}</span>
        <span>${b===3?'reservado a emergencias':'2 horas'}</span></div>
        ${tareas.map(cardTarea).join('')}</div>`;
    }
    // bloque extra ilimitado
    const ext = tareasDe(f).filter(p=>p.tec===tk && p.bloque>=4);
    h += `<div class="slot" data-tec="${tk}" data-b="4" ondragover="dOver(event)"
      ondragleave="this.classList.remove('over')" ondrop="dDrop(event,'${tk}',4,'${f}')">
      <div class="sh"><span>Extra · fuera de bloque</span><span>${ext.length} carga${ext.length==1?'':'s'}</span></div>
      ${ext.map(cardTarea).join('')}
      <button class="btn ghost" style="width:100%;margin-top:4px" onclick="modalAgregar('${tk}')">+ sumar aquí</button></div>`;
    h += '</div>';
  }
  h += '</div>';
  document.getElementById('v-hoy').innerHTML=h;
}
function sigHabilAtras(s){ let x=addDias(s,-1),g=0; while(!esHabil(x)&&g++<40) x=addDias(x,-1); return x; }

function esPrev(p){ return ES_PREV(p.tipoReal); }
function cardTarea(p){
  const e=E[p.rbd]||{nombre:p.nombre||'(sin ficha)',dir:'',comuna:'',sup:'',gas:''};
  const hecho = p.estado==='realizada';
  const pv = esPrev(p);
  const jard = e.inst && e.inst!=='Junaeb';
  /* mismo establecimiento cargado también en otra tarjeta viva de cerca (±7 días) */
  const dup = vivas().filter(x=>x.rbd===p.rbd && x.id!==p.id
    && Math.abs(fISO(x.fecha)-fISO(p.fecha)) <= 7*864e5);
  const dupHecha = dup.find(x=>x.estado==='realizada');
  return `<div class="task ${claseCard(p.clase)} ${hecho?'done':''}" draggable="true"
    ondragstart="dStart(event,'${p.id}')" >
    <div class="row" style="gap:8px;align-items:flex-start">
      <input type="checkbox" class="chk" ${hecho?'checked':''} onchange="marcar('${p.id}',this.checked)"
        aria-label="Marcar como realizada">
      <div style="flex:1;min-width:0">
        <div class="tt"><span class="rbd">${p.rbd}</span> · ${esc(e.nombre)}</div>
        <div class="td">${esc(e.dir)} · ${esc(e.comuna)} · ${esc(e.gas)}</div>
        <div class="td">${esc(p.detalle||'')}</div>
        <div class="seg" role="group" aria-label="Qué se hizo en la visita">
          <button class="sg ${pv?'on prev':''}" onclick="setTipo('${p.id}','Preventiva')"
            title="Se levantó como Plan Preventivo Mantención">Preventiva</button>
          <button class="sg ${hecho&&!pv?'on corr':''}" onclick="setTipo('${p.id}','Correctiva')"
            title="Fue emergencia o requerimiento">Correctiva</button>
          ${jard?`<span class="mini" style="margin-left:6px">${pv?'suma a la meta de jardines':'no suma a la meta'}</span>`:''}
        </div>
        <div class="tm">
          <span class="score ${sc(p.pts||0)}">${p.pts||'–'}</span>
          <span class="pill ${pillCard(p.clase)}">${p.clase}</span>
          ${p.aplaz?`<span class="pill p-amb">aplazada ${p.aplaz}×</span>`:''}
          ${dup.length?`<span class="pill ${dupHecha&&!hecho?'p-red':'p-amb'}" title="El mismo establecimiento está en otra tarjeta">${
            dupHecha&&!hecho?'ya la hizo '+(dupHecha.tec==='RODRIGO'?'Rodrigo':'Camilo')+' '+fcorto(dupHecha.fecha)
            :'repetida · '+dup.map(x=>(x.tec==='RODRIGO'?'Rodrigo':'Camilo')+' '+fcorto(x.fecha)).join(', ')}</span>`:''}
          ${e.sup?`<span class="mini">Sup: ${esc(e.sup)}</span>`:''}
          <span style="margin-left:auto;display:flex;gap:4px">
            <button class="tbtn" onclick="traspasar('${p.id}')" title="Pasar al otro técnico"
              aria-label="Pasar al otro técnico">⇄ ${p.tec==='RODRIGO'?'Camilo':'Rodrigo'}</button>
            <button class="tbtn" onclick="modalMover('${p.id}')" title="Cambiar fecha"
              aria-label="Cambiar fecha">📅</button>
            <button class="tbtn" onclick="fichaEstab(${p.rbd})" aria-label="Ver ficha">ficha</button>
            <button class="tbtn" onclick="anularTrabajo('${p.id}')" title="Ya no corresponde: sacarla del plan"

function aplicarNoEjec(id){
  const p = todas().find(x=>x.id===id); if(!p) return;
  const nueva = document.getElementById('neFecha').value || sigHabil(p.fecha);
  const tec = document.getElementById('neTec').value;

  p.aplaz = (p.aplaz||0) + 1;
  p.pts = Math.min(20, (p.pts||0) + 1);
  p.fecha = nueva; p.tec = tec; p.estado = 'programada';
  ST.log.push({ts:new Date().toISOString(), id, rbd:p.rbd, aplaz:p.aplaz, nueva,
    motivo: mot + (nota?' — '+nota:'') + ' (venía del '+antes+')'});
  reordenarDia(nueva); reordenarDia(antes);

/* ---- anular: ya no corresponde (o lo hizo el otro técnico) ----
   Se pide confirmar dentro del mismo cuadro (no con confirm(), que el celular
   puede bloquear) y antes se simula el cambio para mostrar si mueve las metas. */
function impactoAnular(p){
  const antes = avance(); const era = p.estado;
  p.estado = 'anulada'; const desp = avance(); p.estado = era;
  return {antes, desp, cambia: antes.hechoJ!==desp.hechoJ || antes.hechoG!==desp.hechoG
          || antes.medias!==desp.medias};
}
function hermanas(p){
  /* otras visitas del mismo establecimiento que siguen vivas */
  return vivas().filter(x=>x.rbd===p.rbd && x.id!==p.id);
}
function anularTrabajo(id){
  const p = todas().find(x=>x.id===id); if(!p) return;
  const e = E[p.rbd]||{};
  const hechas = hermanas(p).filter(x=>x.estado==='realizada').sort((a,b)=>a.fecha<b.fecha?1:-1).slice(0,3);
  const cerca = hechas.filter(x=>Math.abs(fISO(x.fecha)-fISO(p.fecha)) <= 7*864e5);
  const imp = impactoAnular(p);
  const tn = t => (D.META.tecnicos[t]||{nombre:t||'—'}).nombre;
  let aviso;
  if(!imp.cambia){
    aviso = `<div class="card" style="background:var(--greenSoft,#e7f4ec);margin-top:12px">
      <b>No cambia las cuentas</b>
      <div class="mini">Meta 1 JUNAEB: ${imp.antes.hechoJ} de ${imp.antes.junaeb} → ${imp.desp.hechoJ} ·
        Meta 2 jardines: ${imp.antes.hechoG} de ${imp.antes.jard} → ${imp.desp.hechoG}</div>
      ${hechas.length?`<div class="mini" style="margin-top:4px">Queda vigente la visita realizada:
        ${hechas.map(h=>`${fmt(h.fecha)} · ${tn(h.tec)}${h.folio?' · folio '+h.folio:''}`).join(' / ')}</div>`:''}</div>`;
  } else {
    aviso = `<div class="card" style="background:var(--redSoft);margin-top:12px">
      <b>Ojo: esto SÍ baja las cuentas</b>
      <div class="mini">Meta 1 JUNAEB: ${imp.antes.hechoJ} → ${imp.desp.hechoJ} ·
        Meta 2 jardines: ${imp.antes.hechoG} → ${imp.desp.hechoG}${imp.antes.medias!==imp.desp.medias?' · a medias: '+imp.antes.medias+' → '+imp.desp.medias:''}</div>
      <div class="mini" style="margin-top:4px">${p.estado==='realizada'
        ? 'Esta es la visita realizada que cuenta para el establecimiento. Si la hizo el otro técnico, anula la otra tarjeta, no esta.'
        : 'Revisa antes de seguir.'}</div></div>`;
  }
  modal(`<h2>Ya no corresponde</h2>
   <div class="dim">${p.rbd} · ${esc(e.nombre||p.nombre||'')} — ${fmt(p.fecha)} con ${tn(p.tec)}${p.estado==='realizada'?' · <b>marcada como realizada</b>':''}.</div>
   ${aviso}
   <div style="margin-top:10px"><label class="f" for="anMotivo">Motivo</label>
     <select id="anMotivo">
       ${cerca.length?`<option value="hecha">Ya la hizo ${cerca.map(h=>tn(h.tec).split(' ')[0]).filter((v,i,a)=>a.indexOf(v)===i).join(' / ')}</option>`:''}
       <option>Ya no corresponde</option><option>Duplicada</option><option>La resolvió otra área</option>
       <option>El establecimiento la canceló</option><option>Otro motivo</option></select></div>
   <div class="row" style="margin-top:14px">
     <button class="btn red" onclick="confirmarAnular('${id}')">${imp.cambia?'Anular igual':'Sí, sacarla del plan'}</button>
     <button class="btn gray" onclick="cerrarModal()">Cancelar</button></div>`);
}
function confirmarAnular(id){
  const p = todas().find(x=>x.id===id); if(!p) return;
  const sel = document.getElementById('anMotivo');
  let motivo = sel ? sel.options[sel.selectedIndex].text : 'Ya no corresponde';
  const hecha = hermanas(p).filter(x=>x.estado==='realizada')
    .sort((a,b)=>Math.abs(fISO(a.fecha)-fISO(p.fecha))-Math.abs(fISO(b.fecha)-fISO(p.fecha)))[0];
  if(sel && sel.value==='hecha' && hecha) p.absorbidaPor = hecha.id;
  p.estado = 'anulada';
  ST.log.push({ts:new Date().toISOString(), id, rbd:p.rbd, aplaz:p.aplaz||0,
    nueva:'—', motivo:'anulada: '+motivo.toLowerCase()});
  reordenarDia(p.fecha);
  guardar(); cerrarModal(); refrescar();
}

/* ---- qué fue la visita: preventiva o correctiva ---- */
function setTipo(id, tipo){
  const p = todas().find(x=>x.id===id); if(!p) return;
  const era = p.tipoReal;
  p.tipoReal = tipo;
  /* la etiqueta de la tarjeta sigue al tipo real */
  const tieneCor = (p.clase||'').includes('CORRECTIVO');
  if(tipo==='Preventiva') p.clase = tieneCor ? 'PREVENTIVA + CORRECTIVO' : 'PREVENTIVA';
  else if(p.clase!=='EXTRA') p.clase = tieneCor ? 'CORRECTIVO URGENTE' : 'VISITA';
  if(p.estado!=='realizada') p.estado = 'realizada';
  if(era!==tipo) ST.log.push({ts:new Date().toISOString(), id, rbd:p.rbd, aplaz:p.aplaz||0,
    nueva:p.fecha, motivo:'tipo corregido: '+(era||'sin tipo')+' → '+tipo});
  guardar(); refrescar();
}
function marcar(id,v){
  const p = todas().find(x=>x.id===id); if(!p) return;
  p.estado = v?'realizada':'programada';
  guardar(); refrescar();
}
let dragId=null;
function dStart(ev,id){ dragId=id; ev.dataTransfer.effectAllowed='move'; }
function dOver(ev){ ev.preventDefault(); ev.currentTarget.classList.add('over'); }
function dDrop(ev,tec,b,fecha){
  ev.preventDefault(); ev.currentTarget.classList.remove('over');
  const p = todas().find(x=>x.id===dragId); if(!p) return;
  p.tec=tec; p.bloque=b; p.fecha=fecha; guardar(); refrescar();
}

/* ---- traspasar entre técnicos ---- */
function traspasar(id){
  const p = todas().find(x=>x.id===id); if(!p) return;
  p.tec = p.tec==='RODRIGO' ? 'CAMILO' : 'RODRIGO';
  reordenarDia(p.fecha); guardar(); refrescar();
}
function reordenarDia(fecha){
  ['RODRIGO','CAMILO'].forEach(tk=>{
    const ts = tareasDe(fecha).filter(p=>p.tec===tk)
      .sort((a,b)=> (a.bloque-b.bloque) || (b.pts||0)-(a.pts||0));
    const max = esViernes(fecha)?2:3;
    let b=1;
    ts.forEach(p=>{ p.bloque = b<=max ? b : 4; if(b<=max) b++; });
  });
}

    onclick="agPick(${e.rbd})"><b>${e.rbd}</b> · ${esc(e.nombre)}

let fG={desde:D.META.corteS2, hasta:D.META.fin, q:'', inst:'', sup:'', cob:'', soloAct:true};
function semanasEntre(a,b){
  const out=[]; let d=fISO(a); d.setDate(d.getDate()-((d.getDay()+6)%7));
  const fin=fISO(b);
  while(d<=fin){ out.push(d.getFullYear()+'-'+d2(d.getMonth()+1)+'-'+d2(d.getDate()));
    d=new Date(d.getTime()+7*86400000); }
  return out;
}
function rangoG(k){
  if(k==='s2'){ fG.desde=D.META.corteS2; fG.hasta=D.META.fin; }
  if(k==='plan'){ fG.desde=D.META.inicio; fG.hasta=D.META.fin; }
  if(k==='todo'){ fG.desde='2026-05-04'; fG.hasta=D.META.fin; }
  if(k==='mes'){ fG.desde=hoyISO().slice(0,8)+'01'; fG.hasta=addDias(hoyISO(),31); }
  vCrono();
}
function vCrono(){
  const sem=semanasEntre(fG.desde,fG.hasta);

    const c=(porSem[p.rbd]=porSem[p.rbd]||{});

/* --- parser de bitácora con coordenadas --- */
const CAT_ITEMS = D.CATS;
const ITEM2CAT = {}; Object.keys(CAT_ITEMS).forEach(c=>CAT_ITEMS[c].forEach(i=>ITEM2CAT[norm(i)]=c));
const ACCIONES=['mantencion','reparacion','cambio','instalacion','retiro','revision','limpieza'];

async function leerPDFs(files){
  const st=document.getElementById('pdfstat');
  for(const f of files){
    st.textContent='Leyendo '+f.name+'…';
    try{
      const b=await parsePDF(await f.arrayBuffer(), f.name);
      revisarBit(b);
    }catch(e){ st.textContent='No pude leer '+f.name+': '+e.message; console.error(e); }
  }
  st.textContent='';
}
async function parsePDF(buf,nombre){
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let filas=[];
  for(let p=1;p<=pdf.numPages;p++){
    const pg=await pdf.getPage(p); const tc=await pg.getTextContent();
    const off=(p-1)*10000;
    tc.items.forEach(it=>{ const s=(it.str||'').trim(); if(!s) return;
      filas.push({x:it.transform[4], y:off + (10000-it.transform[5]), t:s}); });
  }
  // agrupar en líneas por y
  filas.sort((a,b)=>a.y-b.y || a.x-b.x);
  const lineas=[]; let cur=null;
  filas.forEach(c=>{ if(!cur || Math.abs(c.y-cur.y)>3.2){ cur={y:c.y, cels:[]}; lineas.push(cur);} cur.cels.push(c); });
  lineas.forEach(l=>l.cels.sort((a,b)=>a.x-b.x));
  const texto = lineas.map(l=>l.cels.map(c=>c.t).join('  ')).join('\n');

  const out={archivo:nombre, items:[], fuente:'PDF cargado'};
  let m=texto.match(/FOLIO\s*\n?\s*(\d+)/i); if(m) out.folio=+m[1];
  m=texto.match(/FECHA:\s*(\d{2})\/(\d{2})\/(\d{4})/i); if(m) out.fecha=m[3]+'-'+m[2]+'-'+m[1];
  m=texto.match(/HORA:\s*(\d{1,2}:\d{2})/i); if(m) out.hora=m[1];
  m=texto.match(/RBD:\s*(\d+)/i); if(m) out.rbd=+m[1];
  m=texto.match(/ESTABLECIMIENTO:\s*(.+)/i); if(m) out.estab=m[1].trim();
  m=texto.match(/DIRECCION:\s*(.+?)\s{2,}COMUNA:\s*(.+)/i);
  if(m){ out.direccion=m[1].trim(); out.comuna=m[2].trim(); }
  const nm=[...texto.matchAll(/Nombre:\s*(.+?)\s{2,}Nombre:\s*(.+)/gi)];
  if(nm.length){ out.tecnico=nm[0][1].trim(); out.encargado=nm[0][2].trim(); }
  if(!out.rbd && E[out.rbd]) {}
  // columnas: buscar una cabecera de tabla para fijar x de Cantidad / Accion / Observacion
  let colC=null,colA=null,colO=null,colUb=[];
  for(const l of lineas){
    const txt=l.cels.map(c=>norm(c.t)).join(' ');
    if(txt.includes('cocina')&&txt.includes('cantidad')&&txt.includes('accion')&&txt.includes('observacion')){
      l.cels.forEach(c=>{ const n=norm(c.t);
        if(n==='cantidad') colC=c.x; else if(n==='accion') colA=c.x; else if(n==='observacion') colO=c.x;
        else if(['cocina','bodega','bano','baño','patio','otro'].includes(n)) colUb.push({n:c.t,x:c.x}); });
      if(colC&&colA&&colO) break;
    }
  }
  // recorrer líneas buscando filas con datos
  let etiqueta='';
  for(const l of lineas){
    const izq=l.cels.filter(c=>!colC||c.x<colC-30).map(c=>c.t).join(' ').trim();
    const der=l.cels.filter(c=>colC&&c.x>=colC-30);
    const cab=norm(izq);
    if(['calor','electricidad','frio','vectores','agua','infraestructura'].includes(cab)) { etiqueta=''; continue; }
    if(!der.length){ if(izq) etiqueta=(etiqueta?etiqueta+' ':'')+izq; continue; }
    const acumulado=(etiqueta?etiqueta+' ':'')+izq;
    let item=null;
    Object.keys(ITEM2CAT).forEach(k=>{ if(norm(acumulado).includes(k) && (!item||k.length>norm(item).length)) item=k; });
    if(!item){ etiqueta=acumulado; continue; }
    const nombreItem = CAT_ITEMS[ITEM2CAT[item]].find(i=>norm(i)===item);
    let cant=null, accion='', obs=[], ubic=[];
    der.forEach(c=>{
      const n=norm(c.t);
      if(colA && Math.abs(c.x-colA)<45 && ACCIONES.some(a=>n.startsWith(a))){ accion=c.t; return; }
      if(colO && c.x>=colO-45){ obs.push(c.t); return; }
      if(/^\d+$/.test(n)){
        if(colC && Math.abs(c.x-colC)<40) cant=+n;
        else { const u=colUb.reduce((p,q)=>Math.abs(q.x-c.x)<Math.abs(p.x-c.x)?q:p, colUb[0]||{n:'',x:0});
               ubic.push(u.n+':'+n); }
        return; }
      if(ACCIONES.some(a=>n.startsWith(a))){ accion=c.t; return; }
      obs.push(c.t);
    });
    if(cant==null && !accion && !obs.length){ etiqueta=acumulado; continue; }
    out.items.push({categoria:ITEM2CAT[item], item:nombreItem||item,
      ubicacion:ubic.join(' '), cantidad:cant||1, accion:accion||'Revision',
      observacion:obs.join(' ').trim()});
    etiqueta='';
  }
  return out;
}

    items, fuente:'PDF cargado'};

  const yaPlan = ST.plan.find(p=>p.rbd===b.rbd && p.fecha===b.fecha && p.estado!=='anulada');

    if(fut){ fut.estado='realizada'; fut.folio=b.folio; fut.tipoReal=motivo; }
  }
  guardar(); cerrarModal(); refrescar();
}

    ||norm(e.dir).includes(n)||norm(e.comuna).includes(n)||norm(e.sup).includes(n))).slice(0,8);

  Object.keys(porEst).slice(0,25).forEach(rbd=>{

    h+='</div></details>';

function res(txt,q){ if(!q||q.length<2) return txt;
  try{ return txt.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); }
  catch(e){ return txt; } }

const AL = D.ALIAS||{};
const AL_K = Object.keys(AL).sort((a,b)=>b.length-a.length);
const PAL_COR = {
  GAS:['fuga de gas','olor a gas','olor a la gas','huele a gas','gas'],
  FRIO:['refrigerador','visicooler','congelador','frigobar','camara','cadena de frio','no enfria','temperatura'],
  AGUA:['calefont','califont','agua caliente','llave','griferia','sifon','filtracion','gotera','inundad','presion'],
  ELEC:['foco','luminaria','enchufe','corte de luz','electric','interruptor','tablero','sin luz','corriente'],
  EQUIPO:['horno','anafe','cocinilla','campana','extractor','bano maria','balanza','salad bar','meson'],
};
function detectaCrit(t){
  const n = norm(t);
  for(const k of ['GAS','FRIO','AGUA','ELEC','EQUIPO'])
    if(PAL_COR[k].some(w=>n.includes(w))) return k;
  return 'OTRO';
}
function parseWsp(txt){
  /* acepta el export de WhatsApp y también mensajes pegados sueltos */
  const LINEA = /^\[?(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})[,]?\s+(\d{1,2}):(\d{2})(?::\d{2})?\s*(?:\u202f|\s)?([ap])?\.?\s*m?\.?\]?\s*-?\s*([^:]{1,48}):\s*(.*)$/i;
  const out=[]; let cur=null;
  txt.replace(/\u202f|\u00a0/g,' ').split(/\r?\n/).forEach(ln=>{
    const m = ln.match(LINEA);
    if(m){
      let [,dd,mm,yy,hh,mi,ap,autor,cuerpo]=m;
      yy = yy.length===2 ? '20'+yy : yy;
      let h = +hh; if(ap){ const a=ap.toLowerCase();
        if(a==='p'&&h!==12) h+=12; if(a==='a'&&h===12) h=0; }
      cur = {fecha:`${yy}-${d2(+mm)}-${d2(+dd)}`, hora:`${d2(h)}:${mi}`,
             autor:autor.trim(), texto:cuerpo.trim()};
      out.push(cur);
    } else if(cur && ln.trim()){ cur.texto += ' ' + ln.trim(); }
    else if(!cur && ln.trim()){
      out.push(cur={fecha:hoyISO(), hora:'', autor:'(sin autor)', texto:ln.trim()});
    }
  });
  /* detectar establecimiento y tipo de falla */
  const res=[];
  out.forEach(m=>{
    const t = norm(m.texto);
    if(!t || t.includes('multimedia omitido') || t.includes('se elimino este mensaje')) return;
    const hits = new Set();
    const rbdDirecto = m.texto.match(/\b(\d{4,6})\b/g)||[];
    rbdDirecto.forEach(x=>{ if(E[+x]) hits.add(+x); });
    AL_K.forEach(k=>{ if(k.length>3 && t.includes(k)) hits.add(AL[k]); });
    hits.forEach(rbd=>{
      if(!E[rbd]) return;
      res.push({fecha:m.fecha, autor:m.autor, rbd, texto:m.texto,
                crit:detectaCrit(m.texto), usar:true});
    });
  });
  return {mensajes:out.length, hallazgos:res};
}

function wspIncorporar(){
  if(!wspRes) return;
  const sel=[...document.querySelectorAll('.wsel:checked')].map(i=>+i.dataset.i);
  document.querySelectorAll('.wcrit').forEach(s=>{ wspRes.hallazgos[+s.dataset.i].crit=s.value; });
  let n=0, hoy=hoyISO();
  sel.forEach(i=>{
    const x=wspRes.hallazgos[i];
    const dup = ST.extras.some(z=>z.rbd===x.rbd && z.detalle===x.texto);
    if(dup) return;
    const fecha = x.crit==='GAS' ? (hoy>=D.META.inicio?hoy:D.META.inicio) : sigHabil(hoy);
    ST.extras.push({id:'W'+Date.now()+'-'+i, fecha,
      tec: (E[x.rbd].inst!=='Junaeb'||x.crit==='GAS') ? 'CAMILO' : 'RODRIGO',
      bloque: x.crit==='GAS'?1:3, rbd:x.rbd, clase:'EXTRA',
      detalle:'['+x.autor.split('(')[0].trim()+' '+fcorto(x.fecha)+'] '+x.texto,
      crit:x.crit, quien:x.autor, tipoReal:'Correctiva',
      pts:Math.min(20,(E[x.rbd].pts||5)+(x.crit==='GAS'?4:1)),
      estado:'programada', aplaz:0, origen:'whatsapp'});
    n++;
  });
  guardar();
  const a=document.getElementById('aviso');
  a.innerHTML='<b>'+n+' trabajo(s) incorporado(s)</b><div style="margin-top:5px;font-size:13px">'
    +'Los de gas quedaron para hoy; el resto para el próximo día hábil.</div>';
  a.classList.add('on'); setTimeout(()=>a.classList.remove('on'),4500);
  document.getElementById('wspTxt').value=''; document.getElementById('wspOut').innerHTML='';
  ir('hoy');
}
async function probarRemoto(){
  const el=document.getElementById('remotoEstado');
  el.textContent='Buscando…';
  try{
    const r=await fetch('bot-datos.json?t='+Date.now());
    if(!r.ok) throw new Error('todavía no hay archivo del bot');
    const j=await r.json();
    const n=(j.hallazgos||[]).length;
    el.textContent = n+' hallazgo(s) del bot, último '+(j.generado||'s/f');
    if(n){ wspRes={mensajes:n, hallazgos:j.hallazgos.map(x=>({...x,usar:true}))}; wspAnalizarRemoto(); }
  }catch(e){ el.textContent='Sin datos del bot todavía ('+e.message+')'; }
}

  document.getElementById('wspTxt').value='';
  const guardado=wspRes; wspAnalizar(); wspRes=guardado;
  if(!document.getElementById('wspOut').innerHTML){ wspRes=guardado; }
}

   ${ST.log.length? '<div class="scroll" style="max-height:40vh"><table><tr><th>Cuándo</th><th>RBD</th><th>Veces</th><th>Nueva fecha</th><th>Motivo</th></tr>'
     + ST.log.slice().reverse().map(l=>`<tr><td class="mini">${l.ts.slice(0,16).replace('T',' ')}</td>
       <td><b>${l.rbd}</b></td><td>${l.aplaz>=2?`<span class="pill p-red">${l.aplaz}×</span>`:l.aplaz+'×'}</td>
       <td>${fcorto(l.nueva)}</td><td class="mini">${esc(l.motivo)}</td></tr>`).join('')+'</table></div>'
     : '<div class="dim">Todavía no se ha aplazado nada.</div>'}</div>
   <div class="card"><h2>Estado</h2>
   <div class="kpi">
     <div class="k"><b>${a.hechoJ}/${a.junaeb}</b><span>JUNAEB al 30-oct</span></div>
     <div class="k"><b>${a.hechoG}/${a.jard}</b><span>Jardines al 15-dic</span></div>
     <div class="k"><b>${ST.extras.length}</b><span>trabajos agregados</span></div>
     <div class="k"><b>${ST.bits.length}</b><span>bitácoras cargadas por ti</span></div>
   </div></div>
   <div class="card"><h2>Pesos del puntaje</h2>
   <div class="mini">${Object.entries(D.META.pesos).map(([k,v])=>`${k}: +${v}`).join(' · ')}</div>
   <div class="dim" style="margin-top:6px">Para cambiarlos hay que regenerar datos.js.</div></div>`;
  document.getElementById('v-config').innerHTML=h;
}
function exportar(){
  const blob=new Blob([JSON.stringify({guardado:new Date().toISOString(),...ST},null,1)],
    {type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='soser-respaldo-'+hoyISO()+'.json'; a.click();
}
function importar(f){ if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const s=JSON.parse(r.result);
    ST.plan=s.plan||ST.plan; ST.extras=s.extras||[]; ST.bits=s.bits||[];
    ST.log=s.log||[]; ST.cfg=s.cfg||{}; guardar(); ir('hoy'); alert('Respaldo importado.');
  }catch(e){ alert('El archivo no se pudo leer: '+e.message); } };
  r.readAsText(f); }
function pedirPermiso(){
  if(!('Notification' in window)){ document.getElementById('permstat').textContent='Este navegador no soporta avisos.'; return; }
  Notification.requestPermission().then(p=>{
    document.getElementById('permstat').textContent = p==='granted'
      ? 'Avisos activados. Funcionan mientras esta pestaña esté abierta.'
      : 'Permiso denegado: los avisos saldrán solo dentro de la página.'; });
}

/* ============================ RESPALDO EN GOOGLE ============================ */
const GS_DEF = 'https://script.google.com/macros/s/AKfycbx8mlrYEMlU0gXkvwInPM0tgFG3Oo6PQCU_YhupEhBLvX4vwP_JYngAZG8Kwfwf7pPw/exec';
function gsUrl(){
  const i = document.getElementById('gsUrl');
  const u = (i ? i.value : '') || ST.cfg.gsUrl || GS_DEF;
  return u.trim();
}
function paquete(){
  return {origen:'web', enviado:new Date().toISOString(), estado:{
    META:D.META, ESTAB:D.ESTAB, CORR:D.CORR, MENC:D.MENC, DC:D.DC||[], CATS:D.CATS,
    PLAN: todas().map(p=>({...p})), BITS: ST.bits.concat(D.BITS), LOG: ST.log
  }};
}
async function postGs(cuerpo){
  const u = gsUrl();
  if(!u || !/^https:\/\/script\.google\.com\/macros\//.test(u))
    throw new Error('la URL no parece un Apps Script publicado');
  ST.cfg.gsUrl = u; guardar();
  /* text/plain evita el preflight: Apps Script no responde OPTIONS */
  const r = await fetch(u, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
                           body: JSON.stringify(cuerpo), redirect:'follow'});
  const t = await r.text();
  let j; try{ j = JSON.parse(t); }catch(e){ throw new Error('respuesta inesperada: '+t.slice(0,120)); }
  if(!j.ok) throw new Error(j.error || 'el script devolvió un error');
  return j;
}
async function respaldarGoogle(silencioso){
  const b = document.getElementById('btnGs');
  const el = document.getElementById('gsEstado');
  if(b){ b.disabled = true; b.textContent = 'Subiendo…'; }
  try{
    const j = await postGs(paquete());
    ST.cfg.gsUltimo = j.guardado; ST.cfg.gsHoja = j.hoja; guardar();
    const kk = j.kpi||{};
    const msg = 'Listo · '+j.filas.programa+' visitas y '+j.filas.correctivos+' requerimientos'
      + (kk.meta1 ? ' · JUNAEB '+kk.meta1.hecho+'/'+kk.meta1.total
         +' · jardines '+kk.meta2.hecho+'/'+kk.meta2.total : '')
      + ' · '+j.guardado;
    if(el) el.textContent = msg;
    if(!silencioso) avisoGs('Respaldado en Google', msg);
  }catch(e){
    if(el) el.textContent = 'No se pudo respaldar: '+e.message;
    if(!silencioso) avisoGs('No se pudo respaldar', e.message);
  }finally{
    if(b){ b.disabled = false; b.textContent = 'Respaldar en Google'; }
  }
}
async function probarGs(){
  const el = document.getElementById('gsEstado');
  el.textContent = 'Probando…';
  try{ const j = await postGs({accion:'ping'});
    el.textContent = 'Conexión OK · el script respondió a las '+j.pong; }
  catch(e){ el.textContent = 'Sin conexión: '+e.message
    +' — revisa que la implementación esté como «Cualquier usuario».'; }
}
function abrirTablero(){ const u = gsUrl(); if(u) window.open(u, '_blank'); }

/* ---- traer de vuelta lo respaldado ---- */
async function traerDeGoogle(){
  const el = document.getElementById('gsEstado');
  if(!confirm('Esto trae lo último que respaldaste en Google y reemplaza lo que tengas en este '
    +'navegador. Úsalo cuando cambies de equipo.\n\n¿Seguir?')) return;
  el.textContent = 'Trayendo…';
  try{
    const u = gsUrl();
    const r = await fetch(u + (u.includes('?')?'&':'?') + 'modo=json&t=' + Date.now(), {redirect:'follow'});
    const j = await r.json();
    if(!j || !j.PLAN) throw new Error('el respaldo todavía no tiene datos');
    const propios = j.PLAN.filter(p=>String(p.id).startsWith('X')||String(p.id).startsWith('W')
      ||String(p.id).startsWith('B'));
    ST.plan = j.PLAN.filter(p=>!propios.includes(p));
    ST.extras = propios;
    ST.bits = (j.BITS||[]).filter(b=>b.fuente!=='PDF cargado' || !D.BITS.some(x=>x.folio===b.folio));
    ST.log = j.LOG || [];
    ST.version = D.META.version;
    guardar();
    el.textContent = 'Traído: '+j.PLAN.length+' visitas, '+ST.extras.length+' agregadas a mano.';
    ir('panel');
  }catch(e){ el.textContent = 'No se pudo traer: '+e.message; }
}
function avisoGs(titulo, texto){
  const a = document.getElementById('aviso');
  a.innerHTML = '<b>'+esc(titulo)+'</b><div style="margin-top:5px;font-size:13px">'+esc(texto)+'</div>'
    +'<button class="btn ghost" style="color:#fff;border-color:#fff;margin-top:9px;padding:4px 10px" '
    +'onclick="document.getElementById(\'aviso\').classList.remove(\'on\')">ok</button>';
  a.classList.add('on'); setTimeout(()=>a.classList.remove('on'), 7000);
}

/* ============================ AVISOS ============================ */
let avisado={};
function chequearAvisos(){
  const n=new Date(); const hh=d2(n.getHours())+':'+d2(n.getMinutes());
  if(!D.META.avisos.includes(hh) || avisado[hh]) return;
  avisado[hh]=true;
  const f=hoyISO();
  const pend=tareasDe(f).filter(p=>p.estado!=='realizada');
  const txt = pend.length
    ? pend.slice(0,4).map(p=>`${p.rbd} ${(E[p.rbd]||{}).nombre||''}`).join(' · ')
    : 'No queda nada pendiente para hoy.';
  const cuerpo = `${hh} · ${pend.length} pendiente(s): ${txt}`;
  const a=document.getElementById('aviso');
  a.innerHTML=`<b>Recordatorio ${hh}</b><div style="margin-top:5px;font-size:13px">${esc(cuerpo)}</div>
    <button class="btn ghost" style="color:#fff;border-color:#fff;margin-top:9px;padding:4px 10px"
      onclick="document.getElementById('aviso').classList.remove('on')">ok</button>`;
  a.classList.add('on');
  if(window.Notification && Notification.permission==='granted')
    new Notification('SOSER San Pablo · '+hh, {body:cuerpo});
}
setInterval(chequearAvisos, 20000);

document.getElementById('hdrmeta').textContent =
  'Hoy ' + fmt(hoyISO()) + ' · JUNAEB al ' + fmt(D.META.metaJunaeb) + ' · jardines al ' + fmt(D.META.metaJardines);
if(MIGRADO>0){

    ' visitas nuevas del registro histórico. Tus cambios se conservaron.</div>'+
    '<button class="btn ghost" style="color:#fff;border-color:#fff;margin-top:9px;padding:4px 10px" '+
    'onclick="document.getElementById(\'aviso\').classList.remove(\'on\')">ok</button>';
  a.classList.add('on'); setTimeout(()=>a.classList.remove('on'),9000);
}
ir('panel');
</script>
