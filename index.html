<style>

  --green:#14532d; --green2:#1e6b3a; --greenSoft:#e4f0e8;
  --red:#b3261e; --redSoft:#fbe4e1; --amber:#8a6100; --amberSoft:#fff2cc;

  --r:12px; --sh:0 1px 3px rgba(20,40,30,.09),0 6px 18px rgba(20,40,30,.05);

  --bg:#10150f; --panel:#18201b; --ink:#e8efe9; --muted:#95a39b; --line:#2b352e;
  --greenSoft:#1d3325; --redSoft:#3a201d; --amberSoft:#3a3018; --blueSoft:#1b2a41; --violetSoft:#272040;

}}

  --bg:#10150f; --panel:#18201b; --ink:#e8efe9; --muted:#95a39b; --line:#2b352e;

}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

 padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

header .sub{font-size:11px;opacity:.75;margin-left:auto}
nav{position:sticky;top:44px;z-index:39;background:var(--panel);border-bottom:1px solid var(--line);
 display:flex;gap:2px;overflow-x:auto;padding:0 8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}

 padding:11px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--green2);border-bottom-color:var(--green2)}
main{padding:14px;max-width:1500px;margin:0 auto}
.view{display:none} .view.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
 box-shadow:var(--sh);padding:14px;margin-bottom:14px}
h2{font-size:17px;margin:0 0 4px} h3{font-size:14px;margin:0 0 8px}
.dim{color:var(--muted);font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
button.btn,.btn{background:var(--green2);color:#fff;border:0;border-radius:9px;
 padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--green2);border:1.5px solid var(--green2)}
.btn.red{background:var(--red)} .btn.gray{background:var(--muted)}
.btn:active{transform:translateY(1px)}
input,select,textarea{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);
 border-radius:9px;padding:9px 11px;font:inherit;font-size:14px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green2);border-color:var(--green2)}

 text-transform:uppercase;letter-spacing:.4px;margin:0 0 4px}

.p-red{background:var(--redSoft);color:var(--red)} .p-amb{background:var(--amberSoft);color:var(--amber)}
.p-grn{background:var(--greenSoft);color:var(--green2)} .p-blu{background:var(--blueSoft);color:var(--blue)}

 border-radius:8px;font-weight:800;font-size:13px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);
 border-bottom:2px solid var(--line);padding:7px 8px;position:sticky;top:0;background:var(--panel)}

tr:hover td{background:var(--greenSoft)}

/* tablero */
.board{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:860px){.board{grid-template-columns:1fr}}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}

 border-bottom:2px solid var(--green2)}

 text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between}

 border-radius:9px;padding:9px 10px;margin-bottom:7px;cursor:grab;box-shadow:var(--sh)}
.task.k-cor{border-left-color:var(--red)} .task.k-mix{border-left-color:var(--amber)}
.task.k-extra{border-left-color:var(--violet);border-style:dashed}

 align-items:center;justify-content:center;padding:14px}
.modal.on{display:flex}

 max-height:88vh;overflow:auto;padding:18px}

.kpi .k{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px}
.kpi .k b{display:block;font-size:24px;line-height:1.1} .kpi .k span{font-size:11px;color:var(--muted)}
.bar{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:7px}

 color:#fff;border-radius:4px;font-size:10.5px;padding:0}

 .gantt .cell{width:17px;height:17px;line-height:17px;font-size:9.5px} }

details .in{padding:10px 12px}
.aviso{position:fixed;right:14px;bottom:14px;z-index:120;background:var(--green);color:#fff;

.aviso.on{display:block}
.drop{border:2.5px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--green2);background:var(--greenSoft);color:var(--green2)}
.mini{font-size:11.5px;color:var(--muted)}
mark{background:var(--amberSoft);color:var(--ink);padding:0 2px;border-radius:3px}
:focus-visible{outline:3px solid var(--green2);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}

 padding:3px 8px;font-size:11px;font-weight:700;cursor:pointer;min-height:28px}
.tbtn:hover{border-color:var(--green2);color:var(--green2)}
.wa{background:#e7f6ea;color:#0b2e16;border:1px solid #bfe3c9;border-radius:12px;padding:14px;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa{background:#16281c;color:#dbeee1;border-color:#2c4735}}
:root[data-theme="dark"] .wa{background:#16281c;color:#dbeee1;border-color:#2c4735}

  main{padding:9px} .card{padding:11px}
  header h1{font-size:13.5px} .kpi{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}

<header>
  <h1>SOSER · Sucursal San Pablo</h1>

<main>
  <section class="view" id="v-hoy"></section>

<script>
/* ============================ ESTADO ============================ */
const D = window.SOSER;
const E = {}; D.ESTAB.forEach(e => E[e.rbd] = e);
const LS = 'soser-sanpablo-v1';
let ST = {plan:[], extras:[], bits:[], hechos:{}, log:[], cfg:{}};

/* --- caché persistente: IndexedDB con respaldo en localStorage --- */
let IDB=null;
function abrirIDB(){ return new Promise(res=>{
  if(!window.indexedDB) return res(null);
  const r=indexedDB.open('soser-sanpablo',1);
  r.onupgradeneeded=()=>{ const db=r.result;
    if(!db.objectStoreNames.contains('estado')) db.createObjectStore('estado'); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); }); }
function idbGet(k){ return new Promise(res=>{ if(!IDB) return res(null);
  try{ const t=IDB.transaction('estado','readonly').objectStore('estado').get(k);
    t.onsuccess=()=>res(t.result); t.onerror=()=>res(null); }catch(e){ res(null); } }); }
function idbSet(k,v){ return new Promise(res=>{ if(!IDB) return res(false);
  try{ const t=IDB.transaction('estado','readwrite').objectStore('estado').put(v,k);
    t.onsuccess=()=>res(true); t.onerror=()=>res(false); }catch(e){ res(false); } }); }
async function persistirDuro(){
  if(navigator.storage && navigator.storage.persist){
    try{ const ok=await navigator.storage.persisted() || await navigator.storage.persist();
      return ok; }catch(e){} }
  return false;
}
let MIGRADO = 0;
function fusionar(guardado){
  /* Parte del plan nuevo de datos.js y le vuelve a aplicar lo que el usuario editó,
     emparejando por id. Así entran las visitas nuevas sin perder cambios. */
  const base = JSON.parse(JSON.stringify(D.PLAN));
  const prev = {}; (guardado||[]).forEach(p=>prev[p.id]=p);
  let tocados = 0;
  base.forEach(p=>{
    const v = prev[p.id]; if(!v) return;
    const cambiado = v.estado!=='programada' || v.fecha!==p.fecha || v.tec!==p.tec
      || v.bloque!==p.bloque || (v.aplaz||0)>0 || v.folio;
    if(cambiado){ tocados++;
      p.estado=v.estado; p.fecha=v.fecha; p.tec=v.tec; p.bloque=v.bloque;
      p.aplaz=v.aplaz||0; p.pts=v.pts||p.pts; if(v.folio) p.folio=v.folio;
      if(v.absorbidaPor) p.absorbidaPor=v.absorbidaPor;
      if(v.detalle && v.detalle!==p.detalle) p.detalle=v.detalle; }
  });
  MIGRADO = base.length - (guardado||[]).length;
  return base;
}
function cargar(){
  const raw = localStorage.getItem(LS);
  ST = {plan:JSON.parse(JSON.stringify(D.PLAN)), extras:[], bits:[], hechos:{}, log:[], cfg:{},
        version:D.META.version};
  if(raw){ try{ const s = JSON.parse(raw);
    ST.extras = s.extras||[]; ST.bits = s.bits||[]; ST.hechos = s.hechos||{};
    ST.log = s.log||[]; ST.cfg = s.cfg||{}; ST.ts = s.ts;
    if(s.version === D.META.version && s.plan){ ST.plan = s.plan; }
    else { ST.plan = fusionar(s.plan); ST.version = D.META.version; }
  }catch(e){ console.warn('estado corrupto', e); } }
}
let guardarTO=null;
function guardar(){
  ST.ts = new Date().toISOString(); ST.version = D.META.version;
  try{ localStorage.setItem(LS, JSON.stringify(ST)); }
  catch(e){ console.warn('localStorage lleno', e); }
  clearTimeout(guardarTO);
  guardarTO = setTimeout(()=>{ idbSet('v1', JSON.parse(JSON.stringify(ST))); }, 400);
}
cargar();
(async()=>{
  IDB = await abrirIDB();
  const g = await idbGet('v1');
  if(g && (!ST.ts || (g.ts||'') > ST.ts)){
    const planG = (g.version === D.META.version) ? g.plan : fusionar(g.plan);
    ST = Object.assign(ST, g, {plan:planG, version:D.META.version});
    try{ localStorage.setItem(LS, JSON.stringify(ST)); }catch(e){}
    if(typeof ir==='function') ir(actual);
  }
  await persistirDuro();
})();

/* ============================ UTIL ============================ */
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIA=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function d2(n){return String(n).padStart(2,'0')}
function hoyISO(){ return D.META.hoy }
function fISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmt(s){ if(!s) return '—'; const d=fISO(s); return d2(d.getDate())+'-'+MES[d.getMonth()]+'-'+d.getFullYear(); }
function fcorto(s){ const d=fISO(s); return d2(d.getDate())+'-'+MES[d.getMonth()]; }
function diaSem(s){ return DIA[fISO(s).getDay()] }
function esViernes(s){ return fISO(s).getDay()===5 }
function esHabil(s){ const d=fISO(s).getDay(); return d>=1&&d<=5 && !D.META.feriados.includes(s); }
function addDias(s,n){ const d=fISO(s); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+d2(d.getMonth()+1)+'-'+d2(d.getDate()); }
function sigHabil(s){ let x=addDias(s,1); let g=0; while(!esHabil(x)&&g++<40) x=addDias(x,1); return x; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function sc(p){ return p>=13?'s-hi':p>=9?'s-md':'s-lo'; }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function horaBloque(fecha,b){ return esViernes(fecha) ? (D.META.bloquesV[b]||'—') : (D.META.bloquesLJ[b]||'—'); }
function claseCard(c){
  if(c==='HISTORICO') return 'k-hist';
  if(c==='CORRECTIVO URGENTE') return 'k-cor';
  if(c.includes('CORRECTIVO')) return 'k-mix';
  if(c==='EXTRA') return 'k-extra';
  return ''; }
function pillCard(c){
  if(c==='HISTORICO') return 'p-grn';
  if(c==='CORRECTIVO URGENTE') return 'p-red';
  if(c.includes('CORRECTIVO')) return 'p-amb';
  if(c==='EXTRA') return 'p-vio';
  return 'p-blu'; }

function tareasDe(fecha){
  return ST.plan.filter(p=>p.fecha===fecha && p.estado!=='anulada')
    .concat(ST.extras.filter(x=>x.fecha===fecha));
}
function todas(){ return ST.plan.concat(ST.extras); }

/* ============================ NAV ============================ */
const VISTAS=[['hoy','Hoy'],['semana','Semana'],['crono','Cronograma'],['estab','Establecimientos'],
              ['bits','Bitácoras'],['buscar','Buscador'],['pend','Pendientes'],['supers','Supervisoras'],['config','Ajustes']];
let actual='hoy';
document.getElementById('nav').innerHTML = VISTAS.map(([k,t])=>
  `<button id="nb-${k}" onclick="ir('${k}')" aria-label="Ir a ${t}">${t}</button>`).join('');
function ir(k){ actual=k;
  VISTAS.forEach(([v])=>{ document.getElementById('v-'+v).classList.toggle('on',v===k);
    document.getElementById('nb-'+v).classList.toggle('on',v===k); });
  ({hoy:vHoy,semana:vSemana,crono:vCrono,estab:vEstab,bits:vBits,buscar:vBuscar,pend:vPend,supers:vSupers,config:vConfig})[k]();
  window.scrollTo(0,0);
}
function toggleTema(){ const r=document.documentElement;
  const t=r.getAttribute('data-theme')==='dark'?'light':'dark'; r.setAttribute('data-theme',t);
  try{localStorage.setItem('soser-tema',t)}catch(e){} }
try{ const t=localStorage.getItem('soser-tema'); if(t) document.documentElement.setAttribute('data-theme',t);}catch(e){}

function modal(html){ document.getElementById('modalbox').innerHTML=html;
  document.getElementById('modal').classList.add('on'); }
function cerrarModal(){ document.getElementById('modal').classList.remove('on'); }
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') cerrarModal(); });

/* ====================== AVANCE DE LAS METAS ====================== */
const ES_PREV = t => /plan preventivo|preventiv/i.test(t||'');
function avance(){
  const junaeb = D.ESTAB.filter(e=>e.inst==='Junaeb');
  const jard   = D.ESTAB.filter(e=>e.inst!=='Junaeb');
  /* Meta 1 — JUNAEB: basta con una visita registrada en Datácora entre hoy y el 31-10.
     Cuenta cualquier tipo de formulario, no exige preventiva. */
  const okJ = new Set(todas().filter(p=>p.estado==='realizada'
      && p.fecha >= D.META.inicio && p.fecha <= D.META.metaJunaeb).map(p=>p.rbd));
  /* Meta 2 — jardines: preventiva del 2° semestre, y si el jardín tiene sala cuna
     tienen que estar las dos partes (JI y SC). Viene clasificado del registro. */
  const partes = {};
  todas().filter(p=>p.estado==='realizada' && p.fecha >= D.META.corteS2 && ES_PREV(p.tipoReal))
    .forEach(p=>{ (partes[p.rbd]=partes[p.rbd]||new Set()).add(p.parte||'JI'); });
  const okG = new Set(jard.filter(e=>{
    const h = partes[e.rbd]; if(!h || !h.size) return false;
    return e.nbit===2 ? (h.has('JI') && h.has('SC')) : true;
  }).map(e=>e.rbd));
  const medias = jard.filter(e=>!okG.has(e.rbd) && partes[e.rbd] && partes[e.rbd].size);
  return {junaeb:junaeb.length, hechoJ:junaeb.filter(e=>okJ.has(e.rbd)).length,
          jard:jard.length, hechoG:okG.size, medias:medias.length,
          faltanJ:junaeb.filter(e=>!okJ.has(e.rbd)), faltanG:jard.filter(e=>!okG.has(e.rbd)),
          partes};
}
function barrasMeta(){
  const a=avance();
  const pj=Math.round(100*a.hechoJ/a.junaeb), pg=Math.round(100*a.hechoG/a.jard);
  const tardeJ = hoyISO() > D.META.metaJunaeb && pj<100;
  return `<div class="grid2">
   <div class="card" style="margin:0">
     <h3>Meta 1 · JUNAEB en Datácora</h3>
     <div class="dim">Plazo ${fmt(D.META.metaJunaeb)} · regla número uno · basta con la visita, no exige preventiva</div>
     <div class="row" style="margin-top:8px"><b style="font-size:26px">${a.hechoJ}</b>
       <span class="dim">de ${a.junaeb} · faltan ${a.faltanJ.length}</span>
       <span class="pill ${tardeJ?'p-red':'p-grn'}" style="margin-left:auto">${pj}%</span></div>
     <div class="bar"><i class="${tardeJ?'late':''}" style="width:${pj}%"></i></div>
   </div>
   <div class="card" style="margin:0">
     <h3>Meta 2 · Preventivo jardines</h3>
     <div class="dim">Plazo ${fmt(D.META.metaJardines)} · JUNJI e INTEGRA · cuenta solo con Plan Preventivo,
     y los que tienen sala cuna necesitan las dos bitácoras</div>
     <div class="row" style="margin-top:8px"><b style="font-size:26px">${a.hechoG}</b>
       <span class="dim">de ${a.jard} · faltan ${a.faltanG.length}${a.medias?' ('+a.medias+' a medias)':''}</span>
       <span class="pill p-grn" style="margin-left:auto">${pg}%</span></div>

   </div></div>`;
}

  const f=fechaHoy, vie=esViernes(f);
  const blos = vie?[1,2]:[1,2,3];
  let h = barrasMeta();
  h += `<div class="card"><div class="row">
    <div><label class="f">Día de trabajo</label>
      <input type="date" id="fhoy" value="${f}" onchange="fechaHoy=this.value;vHoy()" style="width:170px"></div>
    <div><label class="f">&nbsp;</label>
      <div class="row"><button class="btn ghost" onclick="fechaHoy=sigHabilAtras(fechaHoy);vHoy()">◀</button>
      <button class="btn ghost" onclick="fechaHoy=sigHabil(fechaHoy);vHoy()">▶</button>
      <button class="btn ghost" onclick="fechaHoy=hoyISO();vHoy()">Hoy</button></div></div>
    <div style="margin-left:auto;text-align:right">
      <div><b>${diaSem(f)} ${fmt(f)}</b></div>
      <div class="dim">${vie?'Viernes · jornada '+D.META.jornadaV+' · 2 bloques':'Jornada '+D.META.jornadaLJ+' · 3 bloques'}</div>
    </div></div>
    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="modalAgregar()">+ Agregar emergencia</button>
      <button class="btn ghost" onclick="modalCierre()">Cerrar día y postergar</button>
      <button class="btn ghost" onclick="imprimirDia()">Imprimir orden</button>
      ${!esHabil(f)?'<span class="pill p-amb">Día no hábil</span>':''}
    </div></div>`;

  h += '<div class="board">';
  for(const tk of ['RODRIGO','CAMILO']){
    const t=D.META.tecnicos[tk];
    h += `<div class="col"><div class="colhead">
      <b>${t.nombre}</b><span class="dim">${t.cred}</span></div>`;
    for(const b of blos){
      const tareas = tareasDe(f).filter(p=>p.tec===tk && p.bloque===b);
      h += `<div class="slot" data-tec="${tk}" data-b="${b}" ondragover="dOver(event)"
        ondragleave="this.classList.remove('over')" ondrop="dDrop(event,'${tk}',${b},'${f}')">
        <div class="sh"><span>Bloque ${b} · ${horaBloque(f,b)}</span>
        <span>${b===3?'reservado a emergencias':'2 horas'}</span></div>
        ${tareas.map(cardTarea).join('')}</div>`;
    }
    // bloque extra ilimitado
    const ext = tareasDe(f).filter(p=>p.tec===tk && p.bloque>=4);
    h += `<div class="slot" data-tec="${tk}" data-b="4" ondragover="dOver(event)"
      ondragleave="this.classList.remove('over')" ondrop="dDrop(event,'${tk}',4,'${f}')">
      <div class="sh"><span>Extra · fuera de bloque</span><span>${ext.length} carga${ext.length==1?'':'s'}</span></div>
      ${ext.map(cardTarea).join('')}
      <button class="btn ghost" style="width:100%;margin-top:4px" onclick="modalAgregar('${tk}')">+ sumar aquí</button></div>`;
    h += '</div>';
  }
  h += '</div>';
  document.getElementById('v-hoy').innerHTML=h;
}
function sigHabilAtras(s){ let x=addDias(s,-1),g=0; while(!esHabil(x)&&g++<40) x=addDias(x,-1); return x; }

function cardTarea(p){
  const e=E[p.rbd]||{nombre:p.nombre||'(sin ficha)',dir:'',comuna:'',sup:'',gas:''};
  const hecho = p.estado==='realizada';
  return `<div class="task ${claseCard(p.clase)} ${hecho?'done':''}" draggable="true"
    ondragstart="dStart(event,'${p.id}')" >
    <div class="row" style="gap:8px;align-items:flex-start">
      <input type="checkbox" class="chk" ${hecho?'checked':''} onchange="marcar('${p.id}',this.checked)">

        <div class="tt">${p.rbd} · ${esc(e.nombre)}</div>

          </span>

}
function marcar(id,v){
  const p = todas().find(x=>x.id===id); if(!p) return;
  p.estado = v?'realizada':'programada';
  const e = E[p.rbd]||{};
  if(v && e.inst && e.inst!=='Junaeb' && !ES_PREV(p.tipoReal)){
    p.tipoReal = confirm('¿Esta visita a '+e.nombre+' se levantó como PLAN PREVENTIVO MANTENCIÓN?\n\n'+
      'Aceptar = sí, cuenta para la meta de jardines.\nCancelar = fue otro formulario (emergencia, DT…).')
      ? 'Plan Preventivo' : 'Emergencia';
  }
  guardar(); vHoy();
}
let dragId=null;
function dStart(ev,id){ dragId=id; ev.dataTransfer.effectAllowed='move'; }
function dOver(ev){ ev.preventDefault(); ev.currentTarget.classList.add('over'); }
function dDrop(ev,tec,b,fecha){
  ev.preventDefault(); ev.currentTarget.classList.remove('over');
  const p = todas().find(x=>x.id===dragId); if(!p) return;
  p.tec=tec; p.bloque=b; p.fecha=fecha; guardar(); vHoy();
}

/* ---- traspasar entre técnicos ---- */
function traspasar(id){
  const p = todas().find(x=>x.id===id); if(!p) return;
  p.tec = p.tec==='RODRIGO' ? 'CAMILO' : 'RODRIGO';
  reordenarDia(p.fecha); guardar(); ir(actual);
}
function reordenarDia(fecha){
  ['RODRIGO','CAMILO'].forEach(tk=>{
    const ts = tareasDe(fecha).filter(p=>p.tec===tk)
      .sort((a,b)=> (a.bloque-b.bloque) || (b.pts||0)-(a.pts||0));
    const max = esViernes(fecha)?2:3;
    let b=1;
    ts.forEach(p=>{ p.bloque = b<=max ? b : 4; if(b<=max) b++; });
  });
}

   <div class="row" style="margin-top:14px">

function aplicarMover(id){
  const p = todas().find(x=>x.id===id); if(!p) return;
  const nueva = document.getElementById('mvFecha').value;
  const tec = document.getElementById('mvTec').value;
  const abs = document.getElementById('mvAbsorbe');
  const antes = p.fecha;
  p.fecha = nueva; p.tec = tec;
  if(abs && abs.checked){
    const otras = todas().filter(x=>x.rbd===p.rbd && x.id!==id && x.estado!=='realizada');
    const extra = otras.map(o=>o.detalle).filter(Boolean);
    otras.forEach(o=>{ o.estado='anulada'; o.absorbidaPor=id;
      ST.log.push({ts:new Date().toISOString(), id:o.id, rbd:o.rbd,
        motivo:'resuelta en la visita del '+nueva, aplaz:o.aplaz||0, nueva}); });
    if(extra.length) p.detalle = (p.detalle||'') + '  ||  ' + extra.join('  ||  ');
    ST.extras = ST.extras.filter(x=>x.estado!=='anulada');
  }
  reordenarDia(nueva); if(antes!==nueva) reordenarDia(antes);
  guardar(); cerrarModal(); ir(actual);
}

function aplicarCierre(){
  const ids=[...document.querySelectorAll('.cierre:checked')].map(i=>i.value);

  let dobles=[];
  ids.forEach(id=>{

/* ============================ CRONOGRAMA ============================ */
let fG={desde:D.META.corteS2, hasta:D.META.fin, q:'', inst:'', sup:'', cob:'', soloAct:true};
function semanasEntre(a,b){
  const out=[]; let d=fISO(a); d.setDate(d.getDate()-((d.getDay()+6)%7));
  const fin=fISO(b);
  while(d<=fin){ out.push(d.getFullYear()+'-'+d2(d.getMonth()+1)+'-'+d2(d.getDate()));
    d=new Date(d.getTime()+7*86400000); }
  return out;
}
function rangoG(k){
  if(k==='s2'){ fG.desde=D.META.corteS2; fG.hasta=D.META.fin; }
  if(k==='plan'){ fG.desde=D.META.inicio; fG.hasta=D.META.fin; }
  if(k==='todo'){ fG.desde='2026-05-04'; fG.hasta=D.META.fin; }
  if(k==='mes'){ fG.desde=hoyISO().slice(0,8)+'01'; fG.hasta=addDias(hoyISO(),31); }
  vCrono();
}
function vCrono(){
  const sem=semanasEntre(fG.desde,fG.hasta);
  const finSem = addDias(sem[sem.length-1],6);
  const act=todas().filter(p=>p.estado!=='anulada' && p.fecha>=sem[0] && p.fecha<=finSem);
  const porSem={};
  act.forEach(p=>{
    let i=-1; for(let k=sem.length-1;k>=0;k--){ if(p.fecha>=sem[k]){ i=k; break; } }
    if(i<0) return;
    const c=(porSem[p.rbd]=porSem[p.rbd]||{});
    if(!c[i] || (c[i].clase==='HISTORICO' && p.clase!=='HISTORICO')) c[i]=p;
  });
  let filas=[...D.ESTAB].filter(e=>{
    if(fG.inst && e.inst!==fG.inst) return false;
    if(fG.sup && e.sup!==fG.sup) return false;
    if(fG.cob && e.cobertura!==fG.cob) return false;
    if(fG.soloAct && !porSem[e.rbd]) return false;
    if(fG.q){ const n=norm(fG.q);
      if(!(String(e.rbd).includes(n)||norm(e.nombre).includes(n)||norm(e.comuna).includes(n))) return false; }
    return true;
  }).sort((a,b)=> b.pts-a.pts || a.rbd-b.rbd);
  const sups=[...new Set(D.ESTAB.map(e=>e.sup))].filter(Boolean).sort();
  let h=barrasMeta();
  h+=`<div class="card"><h2>Carta Gantt</h2>
   <div class="row" style="margin-top:8px">
     <button class="chip ${fG.desde===D.META.corteS2?'on':''}" onclick="rangoG('s2')">2° semestre · desde 01-jul</button>
     <button class="chip ${fG.desde===D.META.inicio?'on':''}" onclick="rangoG('plan')">Solo el plan · oct–dic</button>
     <button class="chip ${fG.desde==='2026-05-04'?'on':''}" onclick="rangoG('todo')">Todo el año</button>
     <button class="chip" onclick="rangoG('mes')">Este mes</button>
   </div>
   <div class="row" style="margin-top:10px">
     <div><label class="f" for="gd">Desde</label><input type="date" id="gd" value="${fG.desde}"
       onchange="fG.desde=this.value;vCrono()" style="width:155px"></div>
     <div><label class="f" for="gh">Hasta</label><input type="date" id="gh" value="${fG.hasta}"
       onchange="fG.hasta=this.value;vCrono()" style="width:155px"></div>
     <div style="flex:1;min-width:170px"><label class="f" for="gq">Buscar</label>
       <input id="gq" value="${esc(fG.q)}" placeholder="RBD, nombre o comuna" oninput="fG.q=this.value;vCrono()"></div>
   </div>
   <div class="row" style="margin-top:8px">
     <select onchange="fG.inst=this.value;vCrono()" style="width:auto" aria-label="Institución">
       <option value="">Toda institución</option>
       ${['Junaeb','Junji','Integra'].map(i=>`<option ${fG.inst===i?'selected':''}>${i}</option>`).join('')}</select>
     <select onchange="fG.sup=this.value;vCrono()" style="width:auto" aria-label="Supervisora">

       ${sups.map(i=>`<option ${fG.sup===i?'selected':''}>${esc(i)}</option>`).join('')}</select>

   </div>

   X extra · <b>H</b> visita histórica del Excel o Datácora. Verde = marcada como realizada.</div>

      <td><span class="score ${sc(e.pts)}">${e.pts}</span></td><td>${esc(e.inst)}</td>`;
    sem.forEach((x,i)=>{ const p=(porSem[e.rbd]||{})[i];
      if(!p){ h+='<td></td>'; return; }
      const conCor=p.clase.includes('CORRECTIVO');
      const L = p.clase==='HISTORICO'?'H':conCor&&p.clase!=='CORRECTIVO URGENTE'?'M':
        p.clase.startsWith('PREVENTIVA')?'P':p.clase.startsWith('VISITA')?'V':

    h+='</tr>';

  h+='</table></div></div>';

}

/* --- parser de bitácora con coordenadas --- */
const CAT_ITEMS = D.CATS;
const ITEM2CAT = {}; Object.keys(CAT_ITEMS).forEach(c=>CAT_ITEMS[c].forEach(i=>ITEM2CAT[norm(i)]=c));
const ACCIONES=['mantencion','reparacion','cambio','instalacion','retiro','revision','limpieza'];

async function leerPDFs(files){
  const st=document.getElementById('pdfstat');
  for(const f of files){
    st.textContent='Leyendo '+f.name+'…';
    try{
      const b=await parsePDF(await f.arrayBuffer(), f.name);
      revisarBit(b);
    }catch(e){ st.textContent='No pude leer '+f.name+': '+e.message; console.error(e); }
  }
  st.textContent='';
}
async function parsePDF(buf,nombre){
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let filas=[];
  for(let p=1;p<=pdf.numPages;p++){
    const pg=await pdf.getPage(p); const tc=await pg.getTextContent();
    const off=(p-1)*10000;
    tc.items.forEach(it=>{ const s=(it.str||'').trim(); if(!s) return;
      filas.push({x:it.transform[4], y:off + (10000-it.transform[5]), t:s}); });
  }
  // agrupar en líneas por y
  filas.sort((a,b)=>a.y-b.y || a.x-b.x);
  const lineas=[]; let cur=null;
  filas.forEach(c=>{ if(!cur || Math.abs(c.y-cur.y)>3.2){ cur={y:c.y, cels:[]}; lineas.push(cur);} cur.cels.push(c); });
  lineas.forEach(l=>l.cels.sort((a,b)=>a.x-b.x));
  const texto = lineas.map(l=>l.cels.map(c=>c.t).join('  ')).join('\n');

  const out={archivo:nombre, items:[], fuente:'PDF cargado'};
  let m=texto.match(/FOLIO\s*\n?\s*(\d+)/i); if(m) out.folio=+m[1];
  m=texto.match(/FECHA:\s*(\d{2})\/(\d{2})\/(\d{4})/i); if(m) out.fecha=m[3]+'-'+m[2]+'-'+m[1];
  m=texto.match(/HORA:\s*(\d{1,2}:\d{2})/i); if(m) out.hora=m[1];
  m=texto.match(/RBD:\s*(\d+)/i); if(m) out.rbd=+m[1];
  m=texto.match(/ESTABLECIMIENTO:\s*(.+)/i); if(m) out.estab=m[1].trim();
  m=texto.match(/DIRECCION:\s*(.+?)\s{2,}COMUNA:\s*(.+)/i);
  if(m){ out.direccion=m[1].trim(); out.comuna=m[2].trim(); }
  const nm=[...texto.matchAll(/Nombre:\s*(.+?)\s{2,}Nombre:\s*(.+)/gi)];
  if(nm.length){ out.tecnico=nm[0][1].trim(); out.encargado=nm[0][2].trim(); }
  if(!out.rbd && E[out.rbd]) {}
  // columnas: buscar una cabecera de tabla para fijar x de Cantidad / Accion / Observacion
  let colC=null,colA=null,colO=null,colUb=[];
  for(const l of lineas){
    const txt=l.cels.map(c=>norm(c.t)).join(' ');
    if(txt.includes('cocina')&&txt.includes('cantidad')&&txt.includes('accion')&&txt.includes('observacion')){
      l.cels.forEach(c=>{ const n=norm(c.t);
        if(n==='cantidad') colC=c.x; else if(n==='accion') colA=c.x; else if(n==='observacion') colO=c.x;
        else if(['cocina','bodega','bano','baño','patio','otro'].includes(n)) colUb.push({n:c.t,x:c.x}); });
      if(colC&&colA&&colO) break;
    }
  }
  // recorrer líneas buscando filas con datos
  let etiqueta='';
  for(const l of lineas){
    const izq=l.cels.filter(c=>!colC||c.x<colC-30).map(c=>c.t).join(' ').trim();
    const der=l.cels.filter(c=>colC&&c.x>=colC-30);
    const cab=norm(izq);
    if(['calor','electricidad','frio','vectores','agua','infraestructura'].includes(cab)) { etiqueta=''; continue; }
    if(!der.length){ if(izq) etiqueta=(etiqueta?etiqueta+' ':'')+izq; continue; }
    const acumulado=(etiqueta?etiqueta+' ':'')+izq;
    let item=null;
    Object.keys(ITEM2CAT).forEach(k=>{ if(norm(acumulado).includes(k) && (!item||k.length>norm(item).length)) item=k; });
    if(!item){ etiqueta=acumulado; continue; }
    const nombreItem = CAT_ITEMS[ITEM2CAT[item]].find(i=>norm(i)===item);
    let cant=null, accion='', obs=[], ubic=[];
    der.forEach(c=>{
      const n=norm(c.t);
      if(colA && Math.abs(c.x-colA)<45 && ACCIONES.some(a=>n.startsWith(a))){ accion=c.t; return; }
      if(colO && c.x>=colO-45){ obs.push(c.t); return; }
      if(/^\d+$/.test(n)){
        if(colC && Math.abs(c.x-colC)<40) cant=+n;
        else { const u=colUb.reduce((p,q)=>Math.abs(q.x-c.x)<Math.abs(p.x-c.x)?q:p, colUb[0]||{n:'',x:0});
               ubic.push(u.n+':'+n); }
        return; }
      if(ACCIONES.some(a=>n.startsWith(a))){ accion=c.t; return; }
      obs.push(c.t);
    });
    if(cant==null && !accion && !obs.length){ etiqueta=acumulado; continue; }
    out.items.push({categoria:ITEM2CAT[item], item:nombreItem||item,
      ubicacion:ubic.join(' '), cantidad:cant||1, accion:accion||'Revision',
      observacion:obs.join(' ').trim()});
    etiqueta='';
  }
  return out;
}

function pintarBusqueda(){
  const n=norm(bq), out=document.getElementById('bres'); if(!out) return;
  const bits=ST.bits.concat(D.BITS);
  if(!n && !bcat){
    out.innerHTML=`<div class="card"><h3>Qué puedes buscar aquí</h3>
     <div class="dim">El nombre de un colegio o jardín, un RBD, o una palabra del trabajo hecho —
     "calefont", "extractor", "salad bar", "fuga". Con los chips de arriba filtras por categoría
     de la bitácora: gas y calor, electricidad, frío, vectores, agua o infraestructura.</div>
     <div class="kpi" style="margin-top:12px">
      <div class="k"><b>${bits.length}</b><span>bitácoras con detalle</span></div>
      <div class="k"><b>${bits.reduce((s,b)=>s+b.items.length,0)}</b><span>ítems revisados</span></div>
      <div class="k"><b>${D.HIST.length}</b><span>visitas del 2° semestre</span></div>
      <div class="k"><b>${D.MENC.length}</b><span>menciones de supervisoras</span></div></div></div>`;
    return;
  }
  // 1. establecimientos
  const ests=D.ESTAB.filter(e=> n && (String(e.rbd).includes(n)||norm(e.nombre).includes(n)
    ||norm(e.dir).includes(n)||norm(e.comuna).includes(n)||norm(e.sup).includes(n))).slice(0,8);
  // 2. ítems de bitácora
  let items=[];
  bits.forEach(b=> b.items.forEach(i=>{
    if(bcat && i.categoria!==bcat) return;
    const blob=norm(i.item+' '+i.accion+' '+i.observacion+' '+(b.estab||'')+' '+b.rbd);
    if(!n || blob.includes(n)) items.push({b,i});
  }));
  // 3. menciones del chat
  const mens=D.MENC.filter(m=> n && (norm(m.texto).includes(n)||String(m.rbd).includes(n)
    ||norm((E[m.rbd]||{}).nombre||'').includes(n))).slice(0,14);
  let h='';
  if(ests.length){ h+=`<div class="card"><h3>Establecimientos (${ests.length})</h3>`;
    ests.forEach(e=>{ h+=`<div class="res" style="cursor:pointer" onclick="fichaEstab(${e.rbd})">
      <b>${e.rbd} · ${res(esc(e.nombre),bq)}</b> <span class="score ${sc(e.pts)}">${e.pts}</span>
      <div class="mini">${esc(e.dir)} · ${esc(e.comuna)} · ${esc(e.inst)} · ${esc(e.gas)} ·
      ${e.s2} visita(s) el 2° semestre · ${esc(e.cobertura)}</div></div>`; });
    h+='</div>'; }
  h+=`<div class="card"><h3>Trabajos realizados ${bcat?'· '+esc(bcat):''} (${items.length})</h3>`;
  if(!items.length) h+='<div class="dim">Sin coincidencias en las bitácoras cargadas.</div>';
  const porEst={}; items.forEach(x=>{ (porEst[x.b.rbd]=porEst[x.b.rbd]||[]).push(x); });
  Object.keys(porEst).slice(0,25).forEach(rbd=>{
    const g=porEst[rbd], e=E[rbd]||{};
    h+=`<details><summary>${rbd} · ${esc(e.nombre||g[0].b.estab||'')} — ${g.length} trabajo(s)</summary><div class="in">`;
    g.forEach(({b,i})=>{ h+=`<div class="res"><b>${res(esc(i.item),bq)}</b>
      <span class="pill p-blu">${esc(i.categoria)}</span> ×${i.cantidad} · ${esc(i.accion)}
      <div class="mini">${res(esc(i.observacion),bq)}</div>
      <div class="mini">Folio ${b.folio||'s/n'} · ${fmt(b.fecha)} · ${esc(b.tecnico||'')}</div></div>`; });
    h+='</div></details>';
  });
  h+='</div>';
  if(mens.length){ h+=`<div class="card"><h3>Reportado por las supervisoras (${mens.length})</h3>`;
    mens.forEach(m=>{ h+=`<div class="res"><b>${fmt(m.fecha)} · ${esc(m.autor)}</b>
      <span class="mini">→ ${m.rbd} ${esc((E[m.rbd]||{}).nombre||'')}</span>
      <div class="mini">${res(esc(m.texto),bq)}</div></div>`; });
    h+='</div>'; }
  out.innerHTML=h;
}
function res(txt,q){ if(!q||q.length<2) return txt;
  try{ return txt.replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>'); }
  catch(e){ return txt; } }

  add('Historial visitas', D.HIST.map(x=>({Fecha:x.fecha, RBD:x.rbd,
    Establecimiento:(E[x.rbd]||{}).nombre||'', Tipo:x.tipo, Folio:x.folio||'',
    Tecnico:(D.META.tecnicos[x.tec]||{}).nombre||x.tec, Fuente:x.fuente})),[11,9,32,18,9,22,20]);

  add('Reportes supervisoras', D.MENC.map(m=>({Fecha:m.fecha, Autor:m.autor, RBD:m.rbd,
    Establecimiento:(E[m.rbd]||{}).nombre||'', Texto:m.texto})),[11,26,9,32,90]);

  const g=compromisos();
  const comp=[]; Object.keys(g).sort().forEach(sup=> g[sup].forEach(i=> comp.push({
    Fecha:i.fecha||'', Supervisora:sup, RBD:i.rbd, Establecimiento:i.nombre||'',
    Comuna:i.comuna||'', Tipo:i.crit, Tecnico:i.tec?(D.META.tecnicos[i.tec]||{}).nombre:'',
    Estado:i.hecho?'Listo':'Pendiente', 'Trabajo comprometido':i.detalle})));
  add('Compromisos supervisoras', comp,[11,20,9,32,17,8,22,11,72]);

  add('Aplazamientos', ST.log.length?ST.log.map(l=>({Cuando:l.ts, RBD:l.rbd,
    Establecimiento:(E[l.rbd]||{}).nombre||'', Veces:l.aplaz, 'Nueva fecha':l.nueva, Motivo:l.motivo}))
    :[{Cuando:'',RBD:'',Establecimiento:'',Veces:'','Nueva fecha':'',Motivo:'Sin aplazamientos registrados'}],
    [20,9,32,8,13,55]);

  XLSX.writeFile(wb,'SOSER_San_Pablo_'+hoyISO()+'.xlsx');
}

function exportar(){
  const blob=new Blob([JSON.stringify({guardado:new Date().toISOString(),...ST},null,1)],
    {type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='soser-respaldo-'+hoyISO()+'.json'; a.click();
}
function importar(f){ if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const s=JSON.parse(r.result);
    ST.plan=s.plan||ST.plan; ST.extras=s.extras||[]; ST.bits=s.bits||[];
    ST.log=s.log||[]; ST.cfg=s.cfg||{}; guardar(); ir('hoy'); alert('Respaldo importado.');
  }catch(e){ alert('El archivo no se pudo leer: '+e.message); } };
  r.readAsText(f); }
function pedirPermiso(){
  if(!('Notification' in window)){ document.getElementById('permstat').textContent='Este navegador no soporta avisos.'; return; }
  Notification.requestPermission().then(p=>{
    document.getElementById('permstat').textContent = p==='granted'
      ? 'Avisos activados. Funcionan mientras esta pestaña esté abierta.'
      : 'Permiso denegado: los avisos saldrán solo dentro de la página.'; });
}

/* ============================ AVISOS ============================ */
let avisado={};
function chequearAvisos(){
  const n=new Date(); const hh=d2(n.getHours())+':'+d2(n.getMinutes());
  if(!D.META.avisos.includes(hh) || avisado[hh]) return;
  avisado[hh]=true;
  const f=hoyISO();
  const pend=tareasDe(f).filter(p=>p.estado!=='realizada');
  const txt = pend.length
    ? pend.slice(0,4).map(p=>`${p.rbd} ${(E[p.rbd]||{}).nombre||''}`).join(' · ')
    : 'No queda nada pendiente para hoy.';
  const cuerpo = `${hh} · ${pend.length} pendiente(s): ${txt}`;
  const a=document.getElementById('aviso');
  a.innerHTML=`<b>Recordatorio ${hh}</b><div style="margin-top:5px;font-size:13px">${esc(cuerpo)}</div>
    <button class="btn ghost" style="color:#fff;border-color:#fff;margin-top:9px;padding:4px 10px"
      onclick="document.getElementById('aviso').classList.remove('on')">ok</button>`;
  a.classList.add('on');
  if(window.Notification && Notification.permission==='granted')
    new Notification('SOSER San Pablo · '+hh, {body:cuerpo});
}
setInterval(chequearAvisos, 20000);

  a.classList.add('on'); setTimeout(()=>a.classList.remove('on'),9000);
}
ir('hoy');
