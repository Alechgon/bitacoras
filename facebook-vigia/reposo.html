<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Vigía · en reposo</title>
  <link rel="icon" href="iconos/32.png">
  <style>
    :root{--tinta:#1c2733;--gris:#65727f;--fondo:#f0f2f5;--card:#fff;--azul:#1877f2;--linea:#e3e8ef}
    @media (prefers-color-scheme: dark){:root{--tinta:#e6eaf0;--gris:#9aa7b4;--fondo:#13181f;--card:#1b222c;--linea:#2a3340}}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--fondo);color:var(--tinta);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:16px;box-sizing:border-box}
    .caja{max-width:420px;background:var(--card);border:1px solid var(--linea);border-radius:14px;padding:22px;text-align:center}
    h1{font-size:18px;margin:8px 0}
    p{color:var(--gris);font-size:13.5px;line-height:1.5;margin:6px 0}
    #cuenta{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin:10px 0 2px}
    #que{font-weight:600}
    button{margin-top:12px;border:0;background:var(--azul);color:#fff;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <div class="caja">
    <img src="iconos/48.png" alt="" width="40" height="40">
    <h1>Vigía en reposo</h1>
    <div id="cuenta">—</div>
    <p id="que"></p>
    <p>Esta pestaña la usa el vigía para mirar tus grupos, una a la vez.
      Déjala abierta: está fijada y silenciada, y no hace clic ni escribe nada.</p>
    <button id="panel">Abrir el panel</button>
  </div>
  <script src="reposo.js"></script>
</body>
</html>
